<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Apex Chaos</title>
    <!-- R89 candidate: mobile Gold virtual viewport; ?goldViewport=native rolls back. -->
    <script>
      (() => {
        const q = new URLSearchParams(location.search);
        const mode = q.get('goldViewport');
        // Default only on handheld/tablet devices; the original desktop game
        // and all native/rollback links remain untouched. No model-size list.
        const ua = navigator.userAgent || '';
        const handheld = /iPhone|iPod|iPad|Android|Windows Phone|Kindle|Silk/i.test(ua) ||
          (/Macintosh/i.test(ua) && (navigator.maxTouchPoints || 0) > 1);
        const native = mode === 'native' || mode === '0';
        if (window.top === window && !native && (mode === '1' || handheld)) {
          const target = new URL('/gold-fidelity-lab.html', location.origin);
          target.search = q.toString();
          location.replace(target.href);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/gold/assets/gold/favicon-r72-owner.png?v=r72" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
