/*
MIRROR_RESEARCH_LEDGER  (honest record — see note)
NOTE: In this build environment the two approved reference images were visible to the author but their raw bytes were NOT
accessible (no file in the project, no upload channel, no image-generation tool). Therefore:
  * No external repository source files were opened during this run. Nothing below claims otherwise.
  * ASSET PACK v3 (bakeArt): still a load-time raster painter, NOT the supplied PNG pixels (still inaccessible). It replaces the
    first-pass parts with: curved horn/crown outlines, large planes, ink frame lines, lit bevel + violet rim, prepared eye/smile
    sprites (drawEye2/drawSmile2) and four distinct false-face reflections (mocking / stale / cold / wrong-looking).
    Press G for the white / gray / black diagnostic sheet.
  * Asset pack = best-effort raster reconstruction: shapes traced by eye from MAIN LOOK + PART SHEET coordinates,
    painted ONCE at load into cached offscreen bitmaps (alpha-clean, glow baked, 3 mip levels each). Every visible
    character part is a raster sprite; the rig never strokes the character at runtime. A pixel-exact swap is possible by
    replacing bake() calls with drawImage of the true cut-outs (same part names / anchors / bounding boxes).
Techniques used (standard practice, applied from prior knowledge, NOT verified against specific repo files this run):
  - Cutout rigging with pivots / parent-child transforms (Spine / DragonBones / PixiJS style)  -> rig*(), drawHalf(), drawPlate()
  - Gold temporal brain: 64 interpolated snapshots of root, velocity, both half transforms, expressions and opponent position.
    Used by false-face role playback, actual historical ghost assembly, hard-turn detection and A2 coordinate-frame rebase.
      used for: false-face delayed mimic, ghost double image, hard-turn/stop lag, swap continuity (history shifted by delta)
  - Mask-driven specular sweep: gradient drawn into a scratch canvas, destination-in with the part raster -> masked(), sweepFill()
  - Hinged strip-mesh peel emulated with N x 3 sliced drawImage quads (no WebGL) -> drawA1World()
  - Split-frame slab / venetian-strip compositing for A2 inversion & residue -> drawSite(), residue strips
  - Soft-constraint formation (staggered ease, edge-slot assignment) -> Node formation
  - Point-capsule test with entry/exit ownership transfer -> projectile routing
  - Fixed 120 Hz step, pooled FX/tween/sweep arrays, bounded history, no per-frame canvas allocation.
Rejected: RGB-split glitch, particle assembly for A1, portal rings for nodes, crystal-growth shards, full-screen blur.
*/
'use strict';
// =====================================================================================
// UTIL
// =====================================================================================
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const eo3=t=>1-Math.pow(1-clamp(t,0,1),3);
const eio=t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const rr=(a,b)=>a+Math.random()*(b-a);
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(2,Math.ceil(w));c.height=Math.max(2,Math.ceil(h));return c};
const angLerp=(a,b,t)=>{let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t};
let bs=7;const br=()=>{bs=(bs*16807)%2147483647;return bs/2147483647};

// =====================================================================================
// RASTER BAKER  (ref space = 1254x1254 MAIN LOOK coordinates)
// =====================================================================================
const P={};
const STOPS=[[7,5,15],[34,28,58],[92,88,120],[170,172,194],[222,224,238],[250,249,255]];
function tone(t,tint){
  t=clamp(t,0,1)*(STOPS.length-1);const i=Math.min(STOPS.length-2,t|0),f=t-i,A=STOPS[i],B=STOPS[i+1];
  let r=lerp(A[0],B[0],f),g=lerp(A[1],B[1],f),b=lerp(A[2],B[2],f);
  if(tint===1){r+=14;g-=4;b+=30}else if(tint===2){r-=10;g+=6;b+=28}
  return 'rgb('+(clamp(r,0,255)|0)+','+(clamp(g,0,255)|0)+','+(clamp(b,0,255)|0)+')';
}
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
function facet(g,pts,t0,t1,tint,ang){
  let cx=0,cy=0;for(const p of pts){cx+=p[0];cy+=p[1]}cx/=pts.length;cy/=pts.length;
  let r=0;for(const p of pts)r=Math.max(r,Math.hypot(p[0]-cx,p[1]-cy));
  const dx=Math.cos(ang)*r,dy=Math.sin(ang)*r;
  const gr=g.createLinearGradient(cx-dx,cy-dy,cx+dx,cy+dy);gr.addColorStop(0,tone(t0,tint));gr.addColorStop(1,tone(t1,tint));
  g.fillStyle=gr;poly(g,pts);g.fill();
}
function rimGlow(g,pts,col,blur,w){g.save();g.shadowColor=col;g.shadowBlur=blur;g.strokeStyle=col;g.lineWidth=w;g.lineJoin='round';poly(g,pts);g.stroke();g.restore()}
function inkEdge(g,pts,lw){g.save();poly(g,pts);g.clip();g.lineWidth=lw*2;g.strokeStyle='#07040f';g.lineJoin='round';poly(g,pts);g.stroke();g.restore()}
function star(g,x,y,r){g.save();g.translate(x,y);g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(0,0,0,0,0,r*.5);rg.addColorStop(0,'rgba(255,255,255,.95)');rg.addColorStop(1,'rgba(180,130,255,0)');g.fillStyle=rg;g.beginPath();g.arc(0,0,r*.5,0,TAU);g.fill();g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.moveTo(-r,0);g.lineTo(0,-r*.07);g.lineTo(r,0);g.lineTo(0,r*.07);g.closePath();g.fill();g.beginPath();g.moveTo(0,-r);g.lineTo(r*.07,0);g.lineTo(0,r);g.lineTo(-r*.07,0);g.closePath();g.fill();g.restore()}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath()}

function bake(name,bb,fn,o){
  o=o||{};const s=o.s||.5,x0=bb[0],y0=bb[1],w=bb[2]-bb[0],h=bb[3]-bb[1];
  const c0=mk(w*s,h*s),g=c0.getContext('2d');
  g.scale(c0.width/w,c0.height/h);g.translate(-x0,-y0);fn(g);
  const lv=[{c:c0,s:c0.width/w}];let prev=c0;
  for(let k=0;k<2;k++){const nw=Math.max(2,prev.width>>1),nh=Math.max(2,prev.height>>1),c=mk(nw,nh),g2=c.getContext('2d');g2.imageSmoothingQuality='high';g2.drawImage(prev,0,0,nw,nh);lv.push({c,s:nw/w});prev=c}
  P[name]={lv,ox:x0,oy:y0,w,h,ax:o.ax!==undefined?o.ax:x0+w/2,ay:o.ay!==undefined?o.ay:y0+h/2};
}
function pick(p,ppu){const L=p.lv;for(let i=L.length-1;i>=0;i--){if(L[i].s>=ppu*.85)return L[i]}return L[0]}
let PU=.1,PPW=1;
function dp(g,name,ppu){const p=P[name];g.drawImage(pick(p,ppu||PU).c,p.ox,p.oy,p.w,p.h)}
const SC=mk(1100,1100),SG=SC.getContext('2d');
function masked(g,name,ppu,fill,alpha,comp){
  const p=P[name],l=pick(p,ppu),w=l.c.width,h=l.c.height;
  SG.globalCompositeOperation='source-over';SG.clearRect(0,0,1100,1100);SG.save();fill(SG,w,h);SG.restore();
  SG.globalCompositeOperation='destination-in';SG.drawImage(l.c,0,0);SG.globalCompositeOperation='source-over';
  g.save();g.globalAlpha*=alpha;if(comp)g.globalCompositeOperation=comp;g.drawImage(SC,0,0,w,h,p.ox,p.oy,p.w,p.h);g.restore();
}
function sweepFill(prog,ang,bw){
  return (s,w,h)=>{const d=Math.hypot(w,h),c=Math.cos(ang),sn=Math.sin(ang),pos=(prog-.5)*d*1.5,cx=w/2+c*pos,cy=h/2+sn*pos,b=d*bw;
    const gr=s.createLinearGradient(cx-c*b,cy-sn*b,cx+c*b,cy+sn*b);
    gr.addColorStop(0,'rgba(170,120,255,0)');gr.addColorStop(.3,'rgba(176,130,255,.38)');gr.addColorStop(.46,'rgba(255,255,255,.92)');gr.addColorStop(.58,'rgba(238,228,255,.62)');gr.addColorStop(.8,'rgba(150,170,255,.2)');gr.addColorStop(1,'rgba(170,120,255,0)');
    s.fillStyle=gr;s.fillRect(0,0,w,h)};
}
const solidFill=(col)=>(s,w,h)=>{s.fillStyle=col;s.fillRect(0,0,w,h)};

function pinfo(pts){
  let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1]});cx/=pts.length;cy/=pts.length;
  let best=0,a=0,b=1;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d>best){best=d;a=i;b=j}}
  let ang=Math.atan2(pts[b][1]-pts[a][1],pts[b][0]-pts[a][0]);if(Math.sin(ang)>0)ang+=Math.PI;
  return {cx,cy,ang,len:best};
}
const PAL={L:{s0:'#ffffff',s1:'#dccdff',i0:'#d9b8ff',i1:'#7a35e6',i2:'#2b0c70'},R:{s0:'#f4f8ff',s1:'#b9c9ff',i0:'#abc9ff',i1:'#4c46d8',i2:'#150b55'}};

function drawEye(g,x,y,w,h,ang,pal,brow,ix){

function drawSmile(g,a,c,b,t){
  g.fillStyle='#07040f';g.beginPath();g.moveTo(a[0],a[1]);g.quadraticCurveTo(c[0],c[1],b[0],b[1]);g.lineTo(b[0],b[1]+t);g.quadraticCurveTo(c[0],c[1]+t*1.9,a[0]+2,a[1]+3);g.closePath();g.fill();

function plateBody(g,pts,bands,tint,info){

  g.save();poly(g,pts);g.clip();g.fillStyle=tone(.8,tint);g.fillRect(-100,-100,1500,1500);
  g.translate(info.cx,info.cy);g.rotate(info.ang);
  bands.forEach(b=>{const y0=lerp(mn,mx,b[0]),y1=lerp(mn,mx,b[1]);const gr=g.createLinearGradient(al,0,ah,0);gr.addColorStop(0,tone(b[2],tint));gr.addColorStop(1,tone(b[3],tint));g.fillStyle=gr;g.fillRect(al-40,y0,ah-al+80,y1-y0);
    g.fillStyle='rgba(255,255,255,.4)';g.fillRect(al-40,y0,ah-al+80,1.8);g.fillStyle='rgba(10,5,30,.4)';g.fillRect(al-40,y1-1.6,ah-al+80,1.6)});
  for(let k=0;k<4;k++){g.fillStyle=k%2?'rgba(255,255,255,.15)':'rgba(30,20,70,.17)';const x=lerp(al,ah,br()),y=lerp(mn,mx,br());g.beginPath();g.moveTo(x,y);g.lineTo(x+(br()-.3)*140,y+(br()-.5)*90);g.lineTo(x+(br()-.2)*110,y+(br()-.5)*130);g.closePath();g.fill()}

function bakePlate(id,bands,tint,glow,eye,smile,stars){
  const pts=PTS[id],info=pinfo(pts);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});
  bake(id,[x0-40,y0-40,x1+40,y1+40],g=>{rimGlow(g,pts,glow,16,5);plateBody(g,pts,bands,tint,info);inkEdge(g,pts,5.5);stars.forEach(s=>star(g,s[0],s[1],s[2]))},{ax:info.cx,ay:info.cy});

  if(mode!==1){g.save();g.globalCompositeOperation='lighter';const rg=g.createRadialGradient(r*.4,0,0,r*.4,0,r*2.8);rg.addColorStop(0,'rgba(255,170,80,.5)');rg.addColorStop(1,'rgba(255,120,40,0)');g.fillStyle=rg;g.fillRect(-r*3,-r*3,r*6.4,r*6);g.restore()}
  const gr=g.createLinearGradient(-L,0,r*1.6,0);gr.addColorStop(0,'rgba(255,120,40,0)');gr.addColorStop(.6,mode===1?'rgba(255,196,150,.92)':'rgba(255,140,50,.96)');gr.addColorStop(1,'rgba(255,246,222,1)');
  g.fillStyle=gr;g.beginPath();g.moveTo(-L,0);g.quadraticCurveTo(-L*.3,-r,r*1.2,-r*.8);g.arc(r*1.2,0,r*.8,-Math.PI/2,Math.PI/2);g.quadraticCurveTo(-L*.3,r,-L,0);g.closePath();g.fill();
  g.fillStyle='#fff';g.beginPath();g.ellipse(r*.4,0,r*.9,r*.42,0,0,TAU);g.fill();
  if(mode===2){g.strokeStyle='rgba(228,228,255,.9)';g.lineWidth=1.1;g.beginPath();g.ellipse(r*.5,0,r*1.7,r*1.1,0,0,TAU);g.stroke()}
  if(mode===1){g.strokeStyle='rgba(190,150,255,.85)';g.lineWidth=.9;g.beginPath();g.ellipse(r*.4,0,r*1.5,r*.95,0,0,TAU);g.stroke()}
  g.restore();
}
function drawProj(g,p){
  if(p.st!==0)return;
  const n=Math.min(p.hn,10);
  if(n>0){g.save();g.lineCap='round';let px=p.x,py=p.y;
    for(let k=0;k<n;k++){const i=((p.hn-1-k)%10+10)%10,x=p.hx[i],y=p.hy[i],a=(1-k/n)*.5;
      g.strokeStyle=p.own===2?'rgba(225,222,255,'+a+')':'rgba(255,150,60,'+a+')';g.lineWidth=[0,3,5,7.5][p.pw]*(1-k/n)+.6;g.beginPath();g.moveTo(px,py);g.lineTo(x,y);g.stroke();px=x;py=y}
    g.restore()}
  drawBolt(g,p.x,p.y,Math.atan2(p.vy,p.vx),p.pw,1,p.own===2?2:0);
}
// ---------- shards + mirror nodes ----------
function drawShardAt(g,x,y,rot,sx,sy,alpha,idx,eyeFn){
  g.save();g.translate(x,y);g.rotate(rot);g.scale(sx,sy);g.globalAlpha=alpha;
  const ppu=PPW*Math.max(sx,sy);dp(g,'shard',ppu);
  if(eyeFn)masked(g,'shard',ppu,eyeFn,1,null);
  for(const s of SW)if(s.on&&s.dl<=0&&s.nm==='sh'+idx)masked(g,'shard',ppu,sweepFill(s.t/s.d,s.ang,s.bw),s.amp*Math.sin(Math.PI*clamp(s.t/s.d,0,1)),null);
  g.restore();
}
function drawFreeShard(g,s,idx){
  const hv=Math.sin(s.ph*1.3)*1.6,hv2=Math.cos(s.ph*1.1)*1.2;
  g.save();g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(s.x+2,s.y+9,7,3.2,0,0,TAU);g.fill();g.restore();
  const side=s.side==='L'?'eL':'eR',pe=P[side],ea=clamp(.3+(s.pe-.4)*.6+.3*Math.sin(s.ph*.8+s.eyeP),0,1),nar=1-.5*clamp(s.pn,0,1),smA=s.repT>0?Math.sin(Math.PI*clamp(s.repT/.7,0,1)):0;
  const eyeFn=(c,w,h)=>{
    c.save();c.translate(w/2,h/2);const k=w/220;c.scale(k,k);
    c.save();c.translate(0,-22);c.scale(.36,.36*nar);c.rotate(side==='eL'?.12:-.12);c.globalAlpha=ea;c.drawImage(pick(pe,.2).c,pe.ox-pe.ax,pe.oy-pe.ay,pe.w,pe.h);c.restore();
    if(smA>.02){const ps=P[s.side==='L'?'sL':'sR'];c.save();c.translate(0,48);c.scale(.3,.3);c.globalAlpha=smA*(.4+.4*s.ps);c.drawImage(pick(ps,.2).c,ps.ox-ps.ax,ps.oy-ps.ay,ps.w,ps.h);c.restore()}
    c.restore();
  };
  drawShardAt(g,s.x+hv,s.y+hv2,s.rot+Math.sin(s.ph*.9)*.04,s.dsx,s.dsy,1,idx,eyeFn);
}
function drawNodeBody(g,n){
  const coh=n.st===2?sstep(7.2,10,n.age):0,fillA=n.st>=2?1:n.fill,inset=.55+.45*fillA,fold=1-n.fold;
  g.save();g.translate(n.x,n.y);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(6,60,20*fold,9,0,0,TAU);g.fill();g.rotate(n.rot);
  if(fillA>.01){
    g.save();g.scale(fold,1);g.globalAlpha=fillA;
    g.beginPath();NV.forEach((v,i)=>{const x=v[0]*inset,y=v[1]*(.7+.3*inset);if(i)g.lineTo(x,y);else g.moveTo(x,y)});g.closePath();g.clip();
    let gr=g.createLinearGradient(0,-62,0,62);gr.addColorStop(0,'#0b0716');gr.addColorStop(1,'#26164c');g.fillStyle=gr;g.fillRect(-30,-70,60,140);
    gr=g.createLinearGradient(-22+Math.sin(simT*.3+n.x)*4,-60,26,44);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.33,'rgba(236,230,255,'+(.4*(1-coh*.5))+')');gr.addColorStop(.46,'rgba(255,255,255,.1)');gr.addColorStop(.6,'rgba(205,195,255,.3)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(-30,-70,60,140);
    // delayed MIRROR expression (face lives on the surface)
    const lag=.30,eA=clamp(Math.max(n.faT>=0&&n.faW===0?Math.sin(Math.PI*clamp(n.faT/1.3,0,1)):0,Math.max(.38,(hs(lag,3)-.34)*1.2)),0,1)*(1-coh*.35);
    const sA=clamp(Math.max(n.faT>=0?Math.sin(Math.PI*clamp((n.faT-.18)/1.1,0,1)):0,(hs(lag+.1,6)-.7)*1.6),0,1)*.85;
    if(eA>.02){const pe=P.eR;g.save();g.globalAlpha=eA*fillA;g.translate(-1,-8);g.scale(.075,.075*(1-.4*hs(lag,5)));g.rotate(-.1);g.drawImage(pick(pe,.22).c,pe.ox-pe.ax,pe.oy-pe.ay,pe.w,pe.h);
      g.globalCompositeOperation='lighter';g.globalAlpha=eA*.5;dp(g,'egR');g.restore()}
    if(sA>.02){const ps=P.sL;g.save();g.globalAlpha=sA*fillA;g.translate(-2,20);g.scale(.07,.07);g.drawImage(pick(ps,.22).c,ps.ox-ps.ax,ps.oy-ps.ay,ps.w,ps.h);g.restore()}
    // projectile image held / travelling inside the surface
    const im=n.img;
    if(im.on){
      const la=im.ang-n.rot;let lx,ly,al;
      if(im.k===0){const t=im.t,e=eo3(t/.2);lx=lerp(im.sx,0,e);ly=lerp(im.sy,im.sy*.3,e);al=t<.3?1:clamp(1-(t-.3)/.45,0,1)}
      else{const t=im.t,e=eo3(t/im.d),dl=(im.dx*Math.cos(n.rot)+im.dy*Math.sin(n.rot)),dv=(-im.dx*Math.sin(n.rot)+im.dy*Math.cos(n.rot));lx=lerp(0,dl*11,e);ly=lerp(2,dv*30,e);al=clamp(t/.1,0,1)*(t>im.d?clamp(1-(t-im.d)/.08,0,1):1);
        const rad=lerp(28,10,e);const rg=g.createRadialGradient(lx,ly,0,lx,ly,rad);rg.addColorStop(0,'rgba(255,255,255,.5)');rg.addColorStop(1,'rgba(200,180,255,0)');g.fillStyle=rg;g.fillRect(lx-rad,ly-rad,rad*2,rad*2)}
      g.save();g.translate(lx,ly);g.scale(.62,.62);drawBolt(g,0,0,la,im.pw,al*.95,1);g.restore();
    }
    // ripples masked to the surface
    for(const r of n.rp){if(r.t<.5){const k=r.t/.5;g.strokeStyle='rgba(235,225,255,'+((1-k)*.8)+')';g.lineWidth=1.3;for(let q=0;q<2;q++){const rad=3+(k-q*.12)*24;if(rad>0){g.beginPath();g.ellipse(r.x,r.y,rad,rad*.55,0,0,TAU);g.stroke()}}}}
    // specular sweeps (broad)
    for(const w of n.sw)if(w.on){const p=w.t/w.d,gr2=g.createLinearGradient(-40+p*100-16,-60,-40+p*100+16,60);gr2.addColorStop(0,'rgba(170,120,255,0)');gr2.addColorStop(.5,'rgba(255,255,255,'+(.7*w.amp*Math.sin(Math.PI*p))+')');gr2.addColorStop(1,'rgba(170,120,255,0)');g.fillStyle=gr2;g.fillRect(-40,-70,80,140)}
    if(n.flash>0){g.fillStyle='rgba(235,225,255,'+(n.flash*.28)+')';g.fillRect(-30,-70,60,140)}
    g.restore();
  }
  g.restore();
  // edge shards (locked pieces) — drawn in world so formation is continuous with free flight
  const sh=n.sh,fl=1-n.fold*.7;
  for(let i=0;i<sh.length;i++){const s=sh[i];let x=s.x,y=s.y,rot=s.rot,sx=s.dsx,sy=s.dsy;
    if(n.st>=2){const jt=coh*2.4;x=s.tx+Math.sin(simT*3+i*2)*jt;y=s.ty+Math.cos(simT*2.6+i)*jt;rot=s.trot+Math.sin(simT*2.2+i*1.7)*coh*.07;
      if(n.st===3){x=lerp(x,n.x,n.fold*.6);y=lerp(y,n.y,n.fold*.6)}sx=s.twid/130*fl;sy=s.tlen/300}
    drawShardAt(g,x,y,rot,sx,sy,n.st===3?1-n.fold:1,SH.indexOf(s),null);
  }
}
function drawFX(g,mem){
  for(const f of FX){if(!f.on||(f.ty===4)!==mem)continue;const k=f.t/f.d;
    if(f.ty===1){g.save();g.translate(f.x,f.y);g.rotate(f.r);g.globalCompositeOperation='lighter';g.globalAlpha=1-k;g.fillStyle='rgba(240,235,255,1)';g.fillRect(-f.s,-f.s*.32,f.s*2,f.s*.64);g.restore()}
    else if(f.ty===5){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=1-k;g.fillStyle='rgba(190,140,255,1)';g.beginPath();g.arc(f.x,f.y,f.s,0,TAU);g.fill();g.restore()}
    else if(f.ty===2){g.save();g.translate(f.x,f.y);g.rotate(f.a);g.globalCompositeOperation='lighter';g.lineWidth=1.3;for(let q=0;q<2;q++){const rad=3+(k-q*.12)*22;if(rad>0){g.strokeStyle='rgba(228,218,255,'+((1-k)*.65)+')';g.beginPath();g.ellipse(0,0,rad*.45,rad,0,0,TAU);g.stroke()}}g.restore()}
    else if(f.ty===4){g.save();g.globalAlpha=f.s*(1-k);g.translate(f.x,f.y);g.scale(K,K);g.translate(-CX,-CY);const p=PL.find(z=>z.id===f.nm);
      g.translate(p.pv[0]+f.a,p.pv[1]+f.b);g.rotate(f.c);g.translate(-p.pv[0],-p.pv[1]);dp(g,f.nm);masked(g,f.nm,PU,whiteFill,.35,null);g.restore()}
  }
}
// =====================================================================================
// WORLD RENDER
// =====================================================================================
let vigC=null;
function drawFloor(g){
  g.fillStyle='#2a2c32';g.fillRect(0,0,ARENA,ARENA);
  const rg=g.createRadialGradient(500,500,40,500,500,720);rg.addColorStop(0,'rgba(255,255,255,.05)');rg.addColorStop(1,'rgba(0,0,0,.18)');g.fillStyle=rg;g.fillRect(0,0,ARENA,ARENA);
  g.strokeStyle='rgba(255,255,255,.04)';g.lineWidth=1.2/PPW;g.beginPath();for(let i=100;i<ARENA;i+=100){g.moveTo(i,0);g.lineTo(i,ARENA);g.moveTo(0,i);g.lineTo(ARENA,i)}g.stroke();
  g.strokeStyle='rgba(170,150,235,.38)';g.lineWidth=5;g.strokeRect(0,0,ARENA,ARENA);
  g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1.5;g.strokeRect(6,6,ARENA-12,ARENA-12);
}
function render(){
  const W=cvs.width,Hh=cvs.height;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#111216';ctx.fillRect(0,0,W,Hh);
  PPW=baseZoom*cam.zm*DPR;PU=PPW*K;
  ctx.setTransform(PPW,0,0,PPW,W/2-cam.x*PPW+cam.sx.x*.3*DPR,Hh/2-cam.y*PPW+cam.sy.x*.3*DPR);
  drawFloor(ctx);
  for(const n of ND)if(n.on)drawNodeBody(ctx,n);
  for(let i=0;i<SH.length;i++){const s=SH[i];if(s.on&&s.st===0)drawFreeShard(ctx,s,i)}
  drawFX(ctx,true);
  drawFoeEntity(ctx);
  drawMirrorEntity(ctx);
  drawResidue(ctx);
  drawHeld(ctx);
  drawA1World(ctx);
  for(const p of PJ)if(p.on)drawProj(ctx,p);
  drawFX(ctx,false);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(vigC){ctx.fillStyle=vigC;ctx.fillRect(0,0,W,Hh)}
  if(DIAG)drawDiag();
}
function updateCamera(dt){
  cam.zm=lerp(cam.zm,cam.tz,1-Math.exp(-dt*5));
  let fx,fy;if(cam.close){fx=M.x;fy=M.y}else{fx=lerp(M.x,F.x,.32);fy=lerp(M.y,F.y,.32)}
  const z=baseZoom*cam.zm,hw=VW/(2*z),hh=VH/(2*z);
  const tx=hw>=520?500:clamp(fx,hw-40,ARENA-hw+40),ty=hh>=520?500:clamp(fy,hh-40,ARENA-hh+40),k=1-Math.exp(-dt*4);
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}
function resize(){
  VW=window.innerWidth;VH=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);
  cvs.width=Math.round(VW*DPR);cvs.height=Math.round(VH*DPR);baseZoom=Math.min(VH/700,VW/1000);
  const v=document.createElement('canvas');v.width=64;v.height=64;const g=v.getContext('2d'),rg=g.createRadialGradient(32,32,16,32,32,46);rg.addColorStop(0,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,.42)');g.fillStyle=rg;g.fillRect(0,0,64,64);
  vigC=ctx.createPattern(v,'no-repeat');
  // pattern is tiny; build a full-size gradient instead (cheap, once per resize)
  const rg2=ctx.createRadialGradient(cvs.width/2,cvs.height/2,Math.min(cvs.width,cvs.height)*.45,cvs.width/2,cvs.height/2,Math.max(cvs.width,cvs.height)*.72);
  rg2.addColorStop(0,'rgba(0,0,0,0)');rg2.addColorStop(1,'rgba(0,0,0,.38)');vigC=rg2;
}

// =====================================================================================
// STEP / RESET / AUTO / INPUT
// =====================================================================================
function step(dt){
  simT+=dt;
  autoStep(dt);
  qStep(dt);twStep(dt);
  stepMirror(dt);stepFoe(dt);
  stepA1(dt);stepA2(dt);
  idleStep(dt);lockStep(dt);
  stepSprings(dt);
  stepProj(dt);stepShards(dt);stepNodes(dt);
  sweepStep(dt);fxStep(dt);
  pushHist();
  updateCamera(dt);
}
function resetAll(){
  Q.length=0;for(const t of TW)t.on=false;for(const s of SW)s.on=false;for(const f of FX)f.on=false;for(const p of PJ)p.on=false;for(const s of SH)s.on=false;
  for(const n of ND){n.on=false;n.sh=[];n.img.on=false;n.st=0}
  Object.assign(E,{eL:.6,eR:.34,nL:.08,nR:.4,sL:.62,sR:.12,gx:0,gy:0,gap:0,slip:0,G:0,fl:0});
  Object.assign(M,{x:330,y:560,vx:0,vy:0,aim:0,drive:null,mv:0,pkx:0,pky:0,turnCd:0,wallCd:0,colCd:0,hitCd:0,busy:0,copyOn:false,copyT:0,dmg:0,sf:0,copyFx:0});
  M.cs.x=M.cs.v=0;M.rec.x=M.rec.v=0;
  Object.assign(F,{x:700,y:430,vx:0,vy:0,tx:700,ty:430,wt:1,aim:Math.PI,flash:0,wspec:-1,hl:-1,shot:0});F.rec.x=F.rec.v=0;
  M.aim=Math.atan2(F.y-M.y,F.x-M.x);
  for(const s of ['L','R']){const h=H[s];h.x.x=h.x.v=h.y.x=h.y.v=h.r.x=h.r.v=0;h.lock=0}
  PL=[mkPlate('UL','L',.095,.30,230,10,.8,10),mkPlate('UR','R',.115,.26,170,12,.6,7),mkPlate('LL','L',.145,.36,200,9,1.0,14),mkPlate('LR','R',.17,.4,150,9,1.25,18)];
  ACC=mkAcc();
  A1.on=false;A2.on=false;A2.res=0;A2.band=0;A2.ghostA=0;A2.tear=0;
  I.beat=4;I.t=0;I.dur=.6;cam.x=500;cam.y=500;cam.sx.x=cam.sx.v=cam.sy.x=cam.sy.v=0;fcT=0;
  hHead=0;histFill();
}
const SPOTS=[[250,300],[760,690],[520,170],[240,760],[780,250]];
function spawnCluster(){
  const ok=SPOTS.filter(sp=>!ND.some(n=>n.on&&Math.hypot(n.x-sp[0],n.y-sp[1])<260)&&Math.hypot(M.x-sp[0],M.y-sp[1])>170&&!SH.some(s=>s.on&&s.st===0&&Math.hypot(s.x-sp[0],s.y-sp[1])<200));
  const sp=ok.length?ok[(Math.random()*ok.length)|0]:SPOTS[(Math.random()*SPOTS.length)|0];spawnShardSet(sp[0],sp[1],5);
}
function routeShot(){
  const live=ND.filter(n=>n.on&&n.st===2);if(live.length<2)return;
  live.sort((a,b)=>Math.hypot(a.x-F.x,a.y-F.y)-Math.hypot(b.x-F.x,b.y-F.y));const n=live[0];fireFoe(1,Math.atan2(n.y-F.y,n.x-F.x));
}
function routeProbe(){
  const live=ND.filter(n=>n.on&&n.st===2).length,have=ND.filter(n=>n.on).length;
  if(live>=2){routeShot();return}
  for(let i=have;i<2;i++)spawnCluster();
  later(4.4,routeShot);
}
const AUTO={on:true,t:0,i:0,L:[]};
function forceBeat(n){I.beat=(n+4)%5;I.t=99}
function buildAuto(){
  const A=(t,fn)=>AUTO.L.push([t,fn]),dr=(x,y)=>()=>{M.drive=(x||y)?{x,y}:null};
  A(0,dr(0,0));
  A(2.4,()=>forceBeat(1));
  A(5.8,dr(1,0));A(6.9,dr(-1,.25));A(7.7,dr(0,0));
  A(9.0,()=>fireFoe(1));A(10.6,()=>fireFoe(2));
  A(12.4,dr(-1,0));A(14.9,dr(0,0));
  A(15.4,dr(1,-.2));A(16.3,dr(0,0));
  A(17.4,()=>castA1(false));
  A(19.6,fireMirror);A(20.05,fireMirror);
  A(21.6,()=>fireFoe(3));A(23.4,()=>fireFoe(3));A(25.2,()=>fireFoe(3));
  A(27.0,spawnCluster);
  A(31.6,routeShot);
  A(34.0,dr(1,0));A(34.9,castA2);A(36.3,dr(0,0));
  A(41.5,()=>{resetAll();AUTO.t=0;AUTO.i=0});
}
function autoStep(dt){
  if(!AUTO.on)return;AUTO.t+=dt;
  while(AUTO.i<AUTO.L.length&&AUTO.t>=AUTO.L[AUTO.i][0]){const fn=AUTO.L[AUTO.i++][1];fn()}
}
function killAuto(){if(AUTO.on){AUTO.on=false;M.drive=null}}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(e.repeat)return;
  if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))killAuto();
  switch(k){
    case 'j':killAuto();castA1(e.shiftKey);break;
    case 'k':killAuto();castA2();break;
    case 'l':killAuto();fireFoe([1,2,3][F.shot++%3]);break;
    case ' ':killAuto();fireMirror();break;
    case 'p':{killAuto();const a=rr(-.6,.6)+(Math.random()<.5?0:Math.PI);hitMirror(Math.cos(a),Math.sin(a),2,M.x-Math.cos(a)*30,M.y-Math.sin(a)*30,true);break}
    case 'm':killAuto();spawnCluster();break;
    case 'f':killAuto();routeProbe();break;
    case 'g':DIAG=!DIAG;break;
    case 'c':cam.close=!cam.close;cam.tz=cam.close?2.4:1;break;
    case 'q':AUTO.on=!AUTO.on;if(AUTO.on){resetAll();AUTO.t=0;AUTO.i=0}else M.drive=null;break;
    case 'r':resetAll();if(AUTO.on){AUTO.t=0;AUTO.i=0}break;
    case 'h':{const h=document.getElementById('hint');h.style.opacity=h.style.opacity==='0'?'1':'0';break}
  }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
let lastT=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(t-lastT)/1000||.016);lastT=t;acc+=dt;let n=0;
  while(acc>=STEP&&n<12){step(STEP);acc-=STEP;n++}
  if(n>=12)acc=0;
  render();
}
function init(){
  cvs=document.getElementById('c');ctx=cvs.getContext('2d');
  bakeSupport();
  bakeArt();
  resize();addEventListener('resize',resize);
  resetAll();buildAuto();
  requestAnimationFrame(frame);
}
init();
</script>
