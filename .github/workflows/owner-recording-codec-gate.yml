name: Owner Recording Codec Gate
on:
  pull_request:
    paths:
      - 'src/game/ownerPlaytestCapture.js'
      - 'tools/testOwnerRecordingCodecSelection.mjs'
      - '.github/workflows/owner-recording-codec-gate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  codec-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/testOwnerRecordingCodecSelection.mjs
  build-recording-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify portrait studio in shipping bundle
        run: |
          test -s dist/index.html
          test -s dist/portrait-studio.html
      - name: Package and verify owner HTML5 ZIP
        run: |
          cd dist
          zip -qr ../apex-chaos-owner-recording-rc1.zip .
          cd ..
          unzip -tqq apex-chaos-owner-recording-rc1.zip
          unzip -Z1 apex-chaos-owner-recording-rc1.zip | grep -qx 'portrait-studio.html'
          unzip -Z1 apex-chaos-owner-recording-rc1.zip | grep -qx 'index.html'
          ls -lh apex-chaos-owner-recording-rc1.zip
      - name: Upload to GitHub draft release (no Actions artifact quota)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="owner-boxe-frost-recording-pr125-${GITHUB_SHA:0:8}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apex-chaos-owner-recording-rc1.zip --clobber
          else
            gh release create "$TAG" apex-chaos-owner-recording-rc1.zip --target "$GITHUB_SHA" --title "APEX CHAOS Owner Recording RC1 — test only" --notes "PRIVATE DIAGNOSTIC. No owner-device FPS or visual/audio acceptance yet. Do not publish to itch." --draft --prerelease
          fi
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft,assets:[.assets[]|{name:.name,size:.size}]}'
