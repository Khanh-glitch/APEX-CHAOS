name: APEX CRYSTALA Real Browser A-B Performance Evidence
on:
  pull_request:
    paths:
      - 'public/game/hero-rework/crystalaPresentationRuntime.js'
      - 'tools/profileCrystalaPerformance.mjs'
      - 'tools/compareCrystalaProfilePair.mjs'
      - 'tools/profileFourHeroScenesBrowser.mjs'
      - '.github/workflows/owner-crystala-bloom-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rc5-versus-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install production app and QA browser driver
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
      - name: Locate browser
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Build unchanged RC5 control from Git commit
        run: |
          git worktree add --detach /tmp/apex-rc5-control 9a7fd071083104ac11d0fe5ad73f075d017eae34
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/apex-rc5-control/node_modules
          cd /tmp/apex-rc5-control
          GITHUB_SHA="$(git rev-parse HEAD)" pnpm build
          (pnpm exec vite preview --host 127.0.0.1 --port 4174 >/tmp/rc5-preview.log 2>&1 &)
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4174/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4174/ >/dev/null
      - name: Build candidate on same runner
        run: |
          pnpm build
          (pnpm exec vite preview --host 127.0.0.1 --port 4173 >/tmp/candidate-preview.log 2>&1 &)
          for i in $(seq 1 80); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Measure RC5 control using identical production profiler
        env:
          APEX_APP_URL: http://127.0.0.1:4174
        run: |
          node tools/profileCrystalaPerformance.mjs | tee /tmp/crystala-rc5.log
          cp docs/hero-rework/crystala-v1/perf/crystala-performance-profile.json /tmp/crystala-rc5.json
      - name: Measure candidate using identical production profiler
        env:
          APEX_APP_URL: http://127.0.0.1:4173
        run: |
          node tools/profileCrystalaPerformance.mjs | tee /tmp/crystala-candidate.log
          cp docs/hero-rework/crystala-v1/perf/crystala-performance-profile.json /tmp/crystala-candidate.json
      - name: Evaluate matched scenarios and preserve CPU proxy evidence
        run: |
          node tools/compareCrystalaProfilePair.mjs /tmp/crystala-rc5.json /tmp/crystala-candidate.json
          test -s crystala-rc5-vs-candidate-perf.json
          echo '===== RC5 ====='
          grep -E 'crystal-prison|crystal-k-wall|crystal-wall|BLOOM_PARITY' /tmp/crystala-rc5.log | tail -n 15 || true
          echo '===== CANDIDATE ====='
          grep -E 'crystal-prison|crystal-k-wall|crystal-wall|BLOOM_PARITY' /tmp/crystala-candidate.log | tail -n 15 || true
      - name: Four-hero RC5 baseline (real skill casts, same browser)
        env:
          APEX_APP_URL: http://127.0.0.1:4174
          APEX_PROFILE_FILE: /tmp/four-hero-rc5.json
        run: node tools/profileFourHeroScenesBrowser.mjs
      - name: Four-hero candidate (real skill casts, same browser)
        env:
          APEX_APP_URL: http://127.0.0.1:4173
          APEX_PROFILE_FILE: /tmp/four-hero-candidate.json
        run: node tools/profileFourHeroScenesBrowser.mjs
      - name: Report four-hero frame timing comparison
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const old=JSON.parse(fs.readFileSync("/tmp/four-hero-rc5.json"));
          const now=JSON.parse(fs.readFileSync("/tmp/four-hero-candidate.json"));
          if(old.pageErrors?.length||now.pageErrors?.length||old.rows.length!==4||now.rows.length!==4)throw Error("invalid browser comparison");
          for(let i=0;i<4;i++){
            const a=old.rows[i],b=now.rows[i];
            if(String(a.matchup)!==String(b.matchup))throw Error("unmatched matchup");
            console.log(JSON.stringify({matchup:a.matchup,oldP95:a.frame.p95,newP95:b.frame.p95,oldDrawP95:a.draw.p95,newDrawP95:b.draw.p95,ratio:Math.round(100*a.frame.p95/b.frame.p95)/100,cast:b.cast}));
          }'
      - name: Repeat four-hero candidate first to counter warm-order bias
        env:
          APEX_APP_URL: http://127.0.0.1:4173
          APEX_PROFILE_FILE: /tmp/four-hero-candidate-repeat.json
        run: node tools/profileFourHeroScenesBrowser.mjs
      - name: Repeat RC5 control second
        env:
          APEX_APP_URL: http://127.0.0.1:4174
          APEX_PROFILE_FILE: /tmp/four-hero-rc5-repeat.json
        run: node tools/profileFourHeroScenesBrowser.mjs
      - name: Combined alternating-order acceptance: no major regression
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const a=["/tmp/four-hero-rc5.json","/tmp/four-hero-rc5-repeat.json"].map(p=>JSON.parse(fs.readFileSync(p)));
          const b=["/tmp/four-hero-candidate.json","/tmp/four-hero-candidate-repeat.json"].map(p=>JSON.parse(fs.readFileSync(p)));
          const avg=(x,y)=>(x+y)/2;
          const rows=[];
          for(let i=0;i<4;i++){
            const old=avg(a[0].rows[i].frame.p95,a[1].rows[i].frame.p95);
            const cur=avg(b[0].rows[i].frame.p95,b[1].rows[i].frame.p95);
            const ratio=cur/Math.max(0.01,old);
            rows.push({matchup:a[0].rows[i].matchup,oldP95:old,newP95:cur,ratio});
            if(ratio>1.20)throw Error("SEVERE FRAME REGRESSION: "+JSON.stringify(rows.at(-1)));
          }
          console.log("ALTERNATING_ORDER_FOUR_HERO "+JSON.stringify(rows));
          '
      # GitHub Actions artifact quota is exhausted; summary stays in job logs.
