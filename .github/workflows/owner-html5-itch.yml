name: Owner HTML5 itch release candidate
on:
  push:
    branches:
      - feature/owner-password-portrait-record-20261101
  pull_request:
    types: [opened, synchronize]
    branches: [perf/bot-wave-lossless-20261028]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  html5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Owner shortcut and compatibility verification
        run: |
          node --check src/game/ownerPlaytestCapture.js
          node tools/testOwnerShortcutCapture.mjs
          pnpm test:runtime-revision
          pnpm test:product-graph
          pnpm test:owner-playtest-economy
          pnpm test:gold-battle-lifecycle
          pnpm test:result-gold
      - name: Build HTML5 production game
        run: pnpm build
      - name: Shipping tree verification
        run: |
          pnpm test:shipping-dist
          test -s dist/index.html
          test -d dist/assets
          test -f dist/game/arsenal/arsenalMetaRuntime.js
      - name: Port production build to itch nested HTML5
        run: |
          printf '%s\n' "$(git rev-parse HEAD)" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
          test -s dist-itch-html5/index.html
          grep -F 'src="./assets/' dist-itch-html5/index.html
          grep -F 'href="./assets/' dist-itch-html5/index.html
      - name: Zip ONLY portable itch output, never raw Vite dist
        run: |
          (cd dist-itch-html5 && zip -q -r -9 ../APEX-CHAOS-owner-F7-F8-HTML5-r3.zip .)
          unzip -Z1 APEX-CHAOS-owner-F7-F8-HTML5-r3.zip | grep -Fx 'index.html'
          sha256sum APEX-CHAOS-owner-F7-F8-HTML5-r3.zip | tee APEX-CHAOS-owner-F7-F8-HTML5-r3.sha256
          du -h APEX-CHAOS-owner-F7-F8-HTML5-r3.zip
      - name: Unpack ZIP and run real Chrome against nested itch iframe
        run: |
          mv dist-itch-html5 dist-itch-html5-transform-source
          mkdir dist-itch-html5
          unzip -q APEX-CHAOS-owner-F7-F8-HTML5-r3.zip -d dist-itch-html5
          npm ci --prefix tools/probe --ignore-scripts
          command -v google-chrome || command -v chromium
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/testOwnerItchPackagedChrome.mjs
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/testOwnerItchCapturePolicyChrome.mjs
      - name: Publish ONLY after verified packaged runtime (new r3 prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: owner-html5-f7-f8-20261101-r3
          SHA: ${{ github.sha }}
        run: |
          test -s reports/owner-itch-qa/receipt.json
          test -s reports/owner-itch-qa/capture-policy-receipt.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" APEX-CHAOS-owner-F7-F8-HTML5-r3.zip APEX-CHAOS-owner-F7-F8-HTML5-r3.sha256 reports/owner-itch-qa/receipt.json reports/owner-itch-qa/capture-policy-receipt.json --clobber
          else
            gh release create "$TAG" APEX-CHAOS-owner-F7-F8-HTML5-r3.zip APEX-CHAOS-owner-F7-F8-HTML5-r3.sha256 reports/owner-itch-qa/receipt.json reports/owner-itch-qa/capture-policy-receipt.json \
              --target "$SHA" \
              --title "APEX CHAOS · verified itch HTML5 owner F7/F8 r3" \
              --notes "Portable ZIP verified: real Chrome desktop+phone Start/Home/BOT live battle plus itch-style CROSS-ORIGIN iframe with display-capture denied; F7 opens actionable standalone link to the same packaged game, where top-level capture policy allows user permission. Actual MediaRecorder output still requires a human permission gesture. See both receipts." \
              --prerelease
          fi
