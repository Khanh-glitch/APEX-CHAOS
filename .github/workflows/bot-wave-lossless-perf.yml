name: BOT WAVE lossless performance acceptance
on:
  push:
    branches:
      - fix/mobile-onboarding-guides-botwave-performance-20261026
    paths:
      - 'public/bot-wave/**'
      - 'public/game/bot-wave/**'
      - 'src/game/botWave/**'
      - 'src/ui/**'
      - '.github/workflows/bot-wave-lossless-perf.yml'
  pull_request:
    paths:
      - 'public/bot-wave/game.html'
      - 'public/game/bot-wave/botWavePresentationV2.js'
      - 'tools/profileBotWaveLosslessBrowser.mjs'
      - '.github/workflows/bot-wave-lossless-perf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chrome-perf:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Existing BOT WAVE deterministic contracts
        run: |
          node tools/testBotWaveHudFlow.mjs
          node tools/testBotWaveNativeParity.mjs
          node tools/testBotWaveLosslessR5.mjs
          node tools/testBotWaveR7NativePhysics.mjs
          node tools/testBotWaveShippingAssets.mjs
      - name: Build and verify original Gold bytes
        run: |
          pnpm build
          node tools/testBotWaveShippingAssets.mjs
      - name: Start production preview
        shell: bash
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/bot-wave-perf.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:4173 -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/bot-wave-perf.log
          exit 1
      - name: Run browser perf and real movement
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
          CHROME_PATH="$CHROME" node tools/profileBotWaveLosslessBrowser.mjs
      - name: Publish timings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-wave-lossless-perf-${{ github.sha }}
          path: docs/boxe/bot-wave-perf/
          if-no-files-found: warn
