name: B05 correct generated provenance manifest
on:
  push:
    branches: ['quest/b05-r90-q5-real-integration']
    paths: ['.github/workflows/quest-b05-provenance-reconcile.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Rebuild from canonical patches, record exactly what drifted
        shell: bash
        run: |
          set -euo pipefail
          node tools/buildGoldCutover.mjs
          git diff --name-only | tee /tmp/b05-postgen.txt
          test "$(wc -l < /tmp/b05-postgen.txt)" -eq 1
          grep -qx public/gold/manifest.json /tmp/b05-postgen.txt
          node tools/buildGoldCutover.mjs --check
      - name: Preserve deterministic generated manifest in integration branch
        shell: bash
        run: |
          git config user.name apex-chaos-integration
          git config user.email apex-chaos-integration@users.noreply.github.com
          git add public/gold/manifest.json
          git commit -m "B05 reconcile generated Gold manifest provenance after Quest HUD overlay"
          git push origin HEAD:refs/heads/quest/b05-r90-q5-real-integration
