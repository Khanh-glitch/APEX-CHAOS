name: APEX CHAOS Runtime-only Cutover Verification
on:
  push:
    branches:
      - maintenance/runtime-only-source-20261117
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate arena mechanics
        run: |
          node scripts/check-arena-integration.mjs
          node scripts/check-arena-boundaries.mjs
      - name: Compile trimmed main and verify dist
        run: |
          pnpm build
          node tools/testShippingDist.mjs
      - name: Build itch nested HTML5 and verify essential routes
        run: |
          node tools/packItchPortable.mjs
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/portrait-studio.html
          for p in apexEvolutionArenas.js apexEvolutionVfxLibrary.js apexEvolutionShaderCompositor.js; do
            test -s "dist-itch-html5/game/evolution/$p"
          done
      - name: Real Chrome desktop and mobile game startup
        run: |
          npm ci --prefix tools/probe --ignore-scripts
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node tools/testOwnerItchPackagedChrome.mjs
