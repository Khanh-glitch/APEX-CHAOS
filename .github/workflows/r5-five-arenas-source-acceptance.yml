name: R5 Five Arenas Source Acceptance
on:
  push:
    branches:
      - release/r5-five-arenas-source-20261117
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install from pinned lock
        run: pnpm install --frozen-lockfile
      - name: Verify Total Evolution source
        run: |
          node scripts/check-arena-integration.mjs
          node scripts/check-arena-boundaries.mjs
          node tools/testRuntimeRevisionGate.mjs
          node --check public/apexEngine.js
          node --check public/game/modes/arsenalBattleRuntime.js
      - name: Build production Gold HTML5
        run: pnpm build
      - name: Verify shipping output
        run: pnpm test:shipping-dist
      - name: Package nested itch HTML5
        run: |
          printf '%s\n' "$(git rev-parse HEAD)" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/portrait-studio.html
          for script in apexEvolutionArenas.js apexEvolutionVfxLibrary.js apexEvolutionShaderCompositor.js; do
            test -s "dist-itch-html5/game/evolution/$script"
          done
          (cd dist-itch-html5 && zip -qr -9 ../APEX-CHAOS-R5-5-ARENAS-SOURCE-BUILD-ITCH.zip .)
          unzip -t APEX-CHAOS-R5-5-ARENAS-SOURCE-BUILD-ITCH.zip >/dev/null
      - name: Real Chromium nested itch + Gold battle smoke
        run: |
          npm ci --prefix tools/probe --ignore-scripts
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node tools/testOwnerItchPackagedChrome.mjs
      - name: Preserve Chrome evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-chaos-five-arenas-chrome-evidence-${{ github.sha }}
          path: reports/owner-itch-qa/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload candidate and source receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apex-chaos-r5-five-arenas-itch-${{ github.sha }}
          path: APEX-CHAOS-R5-5-ARENAS-SOURCE-BUILD-ITCH.zip
          compression-level: 0
          retention-days: 14
