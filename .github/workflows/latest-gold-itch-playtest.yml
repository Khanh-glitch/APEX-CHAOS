name: LATEST Gold + BOT WAVE WASM itch owner acceptance
on:
  push:
    branches: ['fix/latest-gold-bot-wave-itch-20261027']
  pull_request:
    branches: ['fix/unified-gold-session-navigation-20261026']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest-itch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Current Gold: lossless solver numerical parity
        run: node tools/testBotWavePressureWasmParity.mjs
      - name: Build EXACT latest PR109 Gold product including Account and Missions
        run: pnpm build
      - name: Verify Gold mobile entry, Gold direct port and shipping assets
        run: |
          pnpm test:mobile-entry
          pnpm test:gold-direct-port
          pnpm test:shipping-dist
      - name: Package with LATEST Gold native itch packer (not old branch packaging)
        run: |
          node tools/packItchPortable.mjs
          for f in smoke_01.webp smoke_03.webp spark_05.webp spark_07.webp; do
            src="public/assets/arsenal/av/vfx/c/$f"
            dst="dist-itch-html5/assets/arsenal/av/vfx/c/$f"
            if [ ! -s "$dst" ]; then
              test -s "$src" || { echo "Missing Gold visual asset $src"; exit 1; }
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
            fi
          done
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/gold/mission-account.html
          test -s dist-itch-html5/bot-wave/game.html
          test -s dist-itch-html5/ITCH_GUEST_BUILD_SHA.txt
      - name: Chrome E2E home desktop, native mobile, BOT WAVE WASM, zero nested CDN 404
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH" || { echo "Chrome system binary required"; exit 1; }
          CHROME_PATH="$CHROME_PATH" node tools/qaLatestGoldItchBrowser.mjs
      - name: Make direct itch.io HTML5 ZIP, root index.html
        run: |
          cd dist-itch-html5
          zip -q -r ../APEX-CHAOS-LATEST-GOLD-BOT-WAVE-WASM-ITCH.zip .
          cd ..
          unzip -t APEX-CHAOS-LATEST-GOLD-BOT-WAVE-WASM-ITCH.zip >/dev/null
      - name: Upload game ZIP and real browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-chaos-latest-gold-itch-${{ github.sha }}
          path: |
            APEX-CHAOS-LATEST-GOLD-BOT-WAVE-WASM-ITCH.zip
            reports/latest-gold-itch/
          if-no-files-found: warn
