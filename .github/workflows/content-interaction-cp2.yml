name: Content Interaction Admission Gates
on:
  pull_request:
    paths:
      - 'tools/testContentInteractionBaseline.mjs'
      - 'tools/testInteractionPolicyShadow.mjs'
      - 'tools/lib/interactionPolicyCandidate.mjs'
      - 'tools/lib/contentBaseline.mjs'
      - 'src/game/localeCatalog.js'
      - 'tools/testContentAdmissionGate.mjs'
      - 'tools/testV43MagnetFloorPickup.mjs'
      - 'tools/testCoreSixEffectMaterialReadiness.mjs'
      - 'tools/testEquipmentSemanticsContract.mjs'
      - 'src/game/runtimeLoader.js'
      - 'tools/bridgeHunterGoldV10.mjs'
      - 'docs/architecture/content-admission/extensions.json'
      - 'tools/lib/crystalaHarness.mjs'
      - 'public/game/arsenal/**'
      - 'public/game/hero-rework/**'
      - '.github/workflows/content-interaction-cp2.yml'
  workflow_dispatch:
jobs:
  real-runtime-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Freeze real-runtime content interaction baseline
        run: |
          node --check public/game/hero-rework/ailRuntime.js
          node --check tools/testInteractionPolicyShadow.mjs
          node --check tools/lib/interactionPolicyCandidate.mjs
          node tools/testContentInteractionBaseline.mjs
          node tools/testInteractionPolicyShadow.mjs
          node --check tools/testContentAdmissionGate.mjs
          node tools/testContentAdmissionGate.mjs
          node --check tools/testV43MagnetFloorPickup.mjs
          node tools/testV43MagnetFloorPickup.mjs
          node --check tools/testCoreSixEffectMaterialReadiness.mjs
          node tools/testCoreSixEffectMaterialReadiness.mjs
          node --check tools/testEquipmentSemanticsContract.mjs
          node tools/testEquipmentSemanticsContract.mjs
          node tools/testProductAssetIntentGate.mjs
