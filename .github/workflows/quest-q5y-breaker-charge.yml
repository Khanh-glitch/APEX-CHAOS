name: Quest Q5y E05 Charge The Breaker
on:
  push:
    branches: ['quest/q5y-e05-charge-from-q5x']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e05-native:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm arsenal:sfx:materialize
      - name: Q1 Director and Q2 regression
        run: |
          node tools/testQuestDirectorQ1.mjs
          node tools/testQuestGenericRosterQ2.mjs
      - name: E03 & E04 immutable canon and phase contract
        run: |
          node tools/testQuestScrapSwarmQ5.mjs
          node tools/testQuestWeaponRainQ5.mjs
      - name: E05 inert world-target / 6000 genuine damage contract
        run: node tools/testQuestBreakerChargeQ5.mjs
      - name: E05 actual Arsenal bullet collider and milestone acceptance
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-breaker-native
      - name: Production build
        run: pnpm build
      - name: Start physical Gold / Vite server
        shell: bash
        run: |
          pnpm dev:lan > /tmp/q5y-e05-vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/q5y-e05-vite.log
          exit 1
      - name: Find Chrome
        id: chrome
        shell: bash
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Chrome desktop physical signed E01–E05 gameplay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/q5y-e05
        run: node tools/testQuestDirectorQ1Browser.mjs
      - name: Chrome mobile touch physical signed E01–E05 gameplay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/q5y-e05
        run: node tools/testQuestDirectorQ1Browser.mjs --mobile
      - name: Save actual Gold screenshots, native logs and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-q5y-e05-native-chrome-evidence
          path: |
            /tmp/q5y-e05/
            /tmp/q5y-e05-vite.log
          if-no-files-found: warn
