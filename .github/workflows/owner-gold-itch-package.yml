# Produces a downloadable itch.io HTML5 ZIP from the exact Gold owner-review
# branch, without deployment, merge or publication. index.html is at ZIP root.
name: Package Owner Gold for itch.io
on:
  push:
    branches:
      - feature/owner-gold-direct-port-20261026
      - feat/bot-wave-mobile-landscape-floating-stick-20261026
      - fix/mobile-onboarding-guides-botwave-performance-20261026
      - perf/botwave-lossless-refraction-fit-20261027
    paths:
      - '.github/workflows/owner-gold-itch-package.yml'
      - 'gold-mission-account/**'
      - 'tools/packItchPortable.mjs'
      - 'tools/testBotWaveBalance.mjs'
      - 'tools/testFirstSessionRelease.mjs'
      - 'src/**'
      - 'public/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html5-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_APEX_DEV_ADMIN: '0'
      VITE_APEX_GOOGLE_AUTH_ENABLED: '0'
      VITE_APEX_EMAIL_CODE_ENABLED: '0'
    steps:
      - name: Checkout exact owner Gold SHA
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact dependencies
        run: |
          pnpm install --frozen-lockfile
          npm --prefix tools/probe ci --no-audit --no-fund
      - name: Build shipping game including owner Gold
        run: |
          node tools/verifyGoldSourceParity.mjs
          node tools/testBotWaveMobileImmersive.mjs
          node tools/testFirstSessionRelease.mjs
          node tools/testBotWaveHudFlow.mjs
          node tools/testBotWaveNativeParity.mjs
          node tools/testBotWaveLosslessR5.mjs
          pnpm build
          pnpm test:shipping-dist
          pnpm test:gold-direct-port
          test -s dist/index.html
          test -s dist/gold/mission-account.html
          printf '%s\n' "$GITHUB_SHA" > dist/ITCH_GUEST_BUILD_SHA.txt
      - name: Rewrite copy for itch HTML5 nested asset resolution
        run: node tools/packItchPortable.mjs
      - name: Check packed ZIP root and asset integrity
        shell: bash
        run: |
          set -euo pipefail
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/gold/mission-account.html
          test -s dist-itch-html5/ITCH_GUEST_BUILD_SHA.txt
          test "$(cat dist-itch-html5/ITCH_GUEST_BUILD_SHA.txt)" = "$GITHUB_SHA"
          test -d dist-itch-html5/assets
          test -d dist-itch-html5/game
          du -sh dist-itch-html5
      - name: Chrome nested itch.io smoke test (desktop and phone)
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createRequire} from 'node:module';
          import {startNestedServer} from './tools/issue105/nestedServer.mjs';
          const require=createRequire(import.meta.url);
          const puppeteer=require('./tools/probe/node_modules/puppeteer-core');
          const server=await startNestedServer();
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
          try {
            for (const [width,height] of [[1440,900],[390,844]]) {
              const context=await browser.createBrowserContext();
              const page=await context.newPage();
              await page.setViewport({width,height,isMobile:width<600,hasTouch:width<600});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const resp=await page.goto(server.url+'/',{waitUntil:'domcontentloaded',timeout:60000});
              assert.equal(resp.status(),200);
              const iframe=await page.waitForSelector('#itch-game-drop',{timeout:20000});
              const game=await iframe.contentFrame();
              assert.ok(game,'itch wrapper missing game frame');
              await game.waitForSelector('#apex-boot-start',{visible:true,timeout:120000});
              await game.evaluate(()=>document.querySelector('#apex-boot-start')?.click());
              await game.waitForSelector('#apex-welcome-name',{visible:true,timeout:90000});
              await game.type('#apex-welcome-name','APEX TEST');
              console.log('FIRST RUN FORM BEFORE',await game.evaluate(()=>({value:document.querySelector('#apex-welcome-name')?.value,valid:document.querySelector('.apex-welcome-card form')?.checkValidity(),step:!!document.querySelector('.apex-welcome-experience')})));
              await game.click('.apex-welcome-primary');
              console.log('FIRST RUN FORM AFTER',await game.evaluate(()=>({value:document.querySelector('#apex-welcome-name')?.value,error:document.querySelector('.apex-welcome-error')?.textContent,step:!!document.querySelector('.apex-welcome-experience'),gate:!!document.querySelector('.apex-welcome-gate')})));
              await game.waitForSelector('.apex-welcome-experience',{visible:true,timeout:20000});
              await game.evaluate(()=>[...document.querySelectorAll('.apex-welcome-experience button')][1]?.click());
              await game.waitForFunction(()=>!document.querySelector('.apex-welcome-gate'),{timeout:10000});
              const homeControls=await game.evaluate(()=>{
                const a=document.querySelector('#apex-guide-open')?.getBoundingClientRect();
                const b=document.querySelector('#stage .profile .ac')?.getBoundingClientRect();
                const intersection=a&&b?Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)):null;
                const inert=[...document.querySelectorAll('#stage button[data-locked-route]')].filter(x=>getComputedStyle(x).display!=='none').length;
                return {help:!!a,wallet:!!b,intersection,inert};
              });
              assert.ok(homeControls.help&&homeControls.wallet,'Help or AC is missing');
              assert.equal(homeControls.intersection,0,'Help overlaps the AC wallet in mobile/desktop');
              assert.equal(homeControls.inert,0,'Inactive Home routes are still rendered as buttons');
              await game.waitForSelector('#apexMissionsOpen',{timeout:90000});
              await game.evaluate(()=>document.querySelector('#apexMissionsOpen')?.click());
              await game.waitForSelector('.apex-gold-direct-host iframe',{timeout:30000});
              const gold=await (await game.$('.apex-gold-direct-host iframe')).contentFrame();
              await gold.waitForSelector('main h1',{timeout:20000});
              const mission=await gold.evaluate(()=>document.querySelector('main h1')?.textContent?.trim());
              assert.match(mission,/MISSIONS|NHIỆM VỤ/);
              await game.evaluate(()=>window.APEX_ACCOUNT_CENTER?.open());
              await game.waitForFunction(()=>document.querySelector('.apex-gold-direct-host iframe')?.src.includes('screen=account'),{timeout:20000});
              const account=await (await game.$('.apex-gold-direct-host iframe')).contentFrame();
              await account.waitForFunction(()=>/ACCOUNT|TÀI KHOẢN/.test(document.querySelector('main h1')?.textContent||''),{timeout:20000});
              assert.deepEqual(server.serverErrors,[], 'Missing/escaped nested itch assets: '+server.serverErrors.slice(0,5).join('; '));
              assert.deepEqual(errors,[], 'Browser page errors: '+errors.slice(0,5).join('; '));
              console.log('PASS nested itch owner Gold',width,height,mission,'-> Account, missing assets 0');
              await page.close();
              await context.close();
            }
          } finally { await browser.close(); await server.close(); }
          NODE
      - name: Create itch.io HTML5 ZIP (index.html at ZIP root)
        shell: bash
        run: |
          set -euo pipefail
          (cd dist-itch-html5 && zip -q -r ../apex-chaos-itch-gold-html5.zip .)
          unzip -tq apex-chaos-itch-gold-html5.zip
          unzip -Z -1 apex-chaos-itch-gold-html5.zip | grep -qx 'index.html'
          unzip -Z -1 apex-chaos-itch-gold-html5.zip | grep -qx 'gold/mission-account.html'
          ls -lh apex-chaos-itch-gold-html5.zip
          sha256sum apex-chaos-itch-gold-html5.zip | tee apex-chaos-itch-gold-html5.sha256
      - name: Upload ZIP and checksum for owner
        uses: actions/upload-artifact@v4
        with:
          name: apex-chaos-itch-owner-gold-html5
          path: |
            apex-chaos-itch-gold-html5.zip
            apex-chaos-itch-gold-html5.sha256
          retention-days: 30
          if-no-files-found: error
