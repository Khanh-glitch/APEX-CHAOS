name: B6g Native Quest Team Targeting and Breach Physics
on:
  push:
    branches: ['quest/b6g-team-true-projectile-from-b6f']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm arsenal:sfx:materialize
      - name: Quest first-array friendly fire, nearest enemy, retired collider
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-breach-targeting
      - name: E06 native physical bullet KO, three same-allied references and withdrawal
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-breach-native
      - name: E06 pure contract + transfer receipt + 100HP transaction
        run: |
          node tools/testQuestBreachPolicyQ6.mjs
          node tools/testQuestBreachLifecycleB6d.mjs
          node tools/testQuestBreachRetreatB6e.mjs
      - name: Prior five-encounter Quest physical contract regression
        run: |
          node tools/testQuestScrapSwarmQ5.mjs
          node tools/testQuestWeaponRainQ5.mjs
          node tools/testQuestBreakerChargeQ5.mjs
          node tools/buildGoldCutover.mjs --check
          pnpm build
      - name: Start authentic Gold surface on Vite
        shell: bash
        run: |
          pnpm dev:lan > /tmp/b6g-vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b6g-vite.log
          exit 1
      - name: Find Chrome binary
        id: chrome
        shell: bash
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: E01–E05 genuine Chrome Desktop no-retreat regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/b6g-gold
        run: node tools/testQuestDirectorQ1Browser.mjs
      - name: E01–E05 genuine Chrome mobile/touch no-retreat regression
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/b6g-gold
        run: node tools/testQuestDirectorQ1Browser.mjs --mobile
      - name: Upload visual and physical Gold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b6g-targeted-bullets-and-gold-e01-e05
          path: |
            /tmp/b6g-gold/
            /tmp/b6g-vite.log
          if-no-files-found: warn
