name: Cloudflare Pages Owner Preview

on:
  push:
    branches:
      - arena/01a0dc5e-apex-chaos
    paths:
      - '.github/workflows/cloudflare-pages-owner-preview.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: aa522f5ea2f3ab8ddf94970df6821411
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy owner preview to Cloudflare Pages
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy dist             --project-name=apex-chaos             --branch=stormbreaker-v9-owner-playtest             --commit-dirty=true 2>&1 | tee /tmp/cf-pages-deploy.log

      - name: Print expected branch URL
        if: always()
        run: |
          echo "Expected stable branch URL:"
          echo "https://stormbreaker-v9-owner-playtest.apex-chaos.pages.dev"
