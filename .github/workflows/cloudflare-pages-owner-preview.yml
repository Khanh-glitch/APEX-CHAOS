name: Cloudflare Pages Owner Preview

on:
  push:
    branches:
      - fix/owner-v43-native-lifecycle-frost-result-20261010
    paths:
      - '.github/workflows/cloudflare-pages-owner-preview.yml'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.js'
      - 'tools/**'
      - 'result-gold/**'

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: aa522f5ea2f3ab8ddf94970df6821411
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cloudflare credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Embed immutable build identity
        run: |
          printf '%s\n' "$GITHUB_SHA" > dist/V43_OWNER_BUILD_SHA.txt

      - name: Deploy owner preview to Cloudflare Pages
        id: deploy
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy dist             --project-name=apex-chaos             --branch=owner-v43-fix-20261010             --commit-dirty=true 2>&1 | tee /tmp/cf-pages-deploy.log

      - name: Print expected branch URL
        if: always()
        run: |
          echo "Expected stable branch URL:"
          echo "https://owner-v43-fix-20261010.apex-chaos.pages.dev"

      - name: Verify Cloudflare is serving this exact reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          URL="https://owner-v43-fix-20261010.apex-chaos.pages.dev/V43_OWNER_BUILD_SHA.txt"
          for i in $(seq 1 20); do
            GOT="$(curl -fLsS --max-time 15 "$URL" || true)"
            if [ "$GOT" = "$GITHUB_SHA" ]; then
              echo "PLAYTEST PREVIEW MATCHES GITHUB SHA: $GOT"
              exit 0
            fi
            echo "Preview not yet propagated ($i/20): $GOT"
            sleep 3
          done
          echo "::error::Live owner preview SHA did not match exact candidate!"
          exit 1
