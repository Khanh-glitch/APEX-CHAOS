name: Quest CP04 isolated 2v2 spike

on:
  push:
    branches:
      - 'quest/cp04-multi-actor-spike-r59'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quest-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked tooling
        run: pnpm install --frozen-lockfile
      - name: Materialize sound assets for faithful engine boot
        run: pnpm arsenal:sfx:materialize
      - name: Check Quest pure selector adversarial cases
        run: node tools/testQuestMultiActorCore.mjs
      - name: Run REAL Arsenal headless FIRST WAKE 2v2 and existing regressions
        env:
          APEX_EVIDENCE_DIR: /tmp/quest-cp04-acceptance
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-first-wake
      - name: Build production bundle on the Quest branch
        run: pnpm build
      - name: Start Vite for real Continue Story browser acceptance
        shell: bash
        run: |
          pnpm dev:lan > /tmp/quest-cp04-vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/quest-cp04-vite.log
          exit 1
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
      - name: Physically click Continue Story and verify real Quest 2v2
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/quest-cp04-browser
        run: node tools/testQuestContinueStoryBrowser.mjs
      - name: Physically tap Continue Story on mobile-size Chrome
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/quest-cp04-browser
        run: node tools/testQuestContinueStoryBrowser.mjs --mobile
      - name: Record evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-cp04-real-engine-headless
          path: |
            /tmp/quest-cp04-acceptance/
            /tmp/quest-cp04-browser/
            /tmp/quest-cp04-vite.log
          if-no-files-found: warn
