name: BOXE R2 Staged Contracts
on:
  push:
    branches: [feature/boxe-bot-wave-gold-intake-20261014]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bot-wave-41-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Native 41 equipment and Gold art prefix
        run: |
          node tools/testBotWave41Campaign.mjs
          node tools/testBotWaveNativeParity.mjs
          node tools/testBotWaveShippingAssets.mjs
          node tools/testBotWaveLosslessR5.mjs
          node tools/testBotWaveGameRouteR5.mjs
      - name: Build all asset-backed native equipment
        run: pnpm build
      - name: Verify dynamic Gold scripts in shipping bundle
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for(const p of ['game/arsenal/arsenalConfig.js','game/bot-wave/waveCampaign.js','game/bot-wave/nativeArsenalGoldBridge.js','game/arsenal/arsenalWeaponRuntime.js','game/arsenal/arsenalPresentationRuntime.js','game/bot-wave/botWavePresentationV2.js','game/bot-wave/botWavePresentationV2.css'])if(!fs.existsSync('dist/'+p))throw Error('BOT_WAVE_PRUNED_DEPENDENCY '+p)"
      - name: Start integrated product
        shell: bash
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/boxe-wave.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4173 -o /dev/null && exit 0; sleep 1; done
          cat /tmp/boxe-wave.log; exit 1
      - name: Install Chrome controller for real-mode QA
        run: pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
      - name: Chrome Home icon and live Gold BOT WAVE desktop/mobile
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tools/testBoxeModeEntryChrome.mjs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-wave-41-chrome
          path: docs/boxe/r5-browser/
          if-no-files-found: ignore
  semantic-and-c04-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: BOXE R2 authority semantic acceptance
        run: |
          node tools/testBoxeContractsR2.mjs
          node tools/testBoxeBattleRuntime.mjs
          node tools/testBoxeOwnerPhysicsR3.mjs
          node tools/testBoxeR5CombatPhysics.mjs
          node tools/testDictionaryRuntimeParity.mjs
          node tools/testBoxeNormalIntegration.mjs
          node tools/testBoxeNativeArsenal.mjs
          node tools/testBoxeWaveDirector.mjs
          node tools/testBotWave41Campaign.mjs
          node tools/testBoxeWaveInputs.mjs
          node tools/testBoxeWaveArsenalR3.mjs
          node tools/testBoxeComboR4.mjs
          node tools/testBotWaveGameRouteR5.mjs
          node tools/testBotWaveShippingAssets.mjs
          node tools/testBotWaveLosslessR5.mjs
      - name: Latest C04 Field Archive compatibility
        run: node tools/testFieldArchiveC04Profiles.mjs
      - name: Shipping build remains unchanged
        run: |
          pnpm build
          pnpm test:product-graph
          pnpm test:source-hygiene
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';assert.ok(fs.existsSync('dist/bot-wave/game.html'),'Shipping bundle missing BOT WAVE R5.1 gameplay');assert.deepEqual(fs.readFileSync('dist/bot-wave/game.html'),fs.readFileSync('public/bot-wave/game.html'),'Vite altered Gold runtime during build');"
      - name: Report binary Gold gate status without pretending imported
        run: |
          if test -f masters/boxe-gold/THE_HAND_GOLD_ORIGINAL.html; then
            node tools/testBoxeGoldIntakeGate.mjs
          else
            echo "::notice::Owner-supplied Gold R2 engine, SFX and artwork restored and SHA-locked. The 26MB standalone is archived outside this repo; shipped Wave replaces only the old gun simulation with native Arsenal."
          fi
      - name: Browser dependencies
        run: pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
      - name: Start built product preview
        shell: bash
        run: |
          nohup pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/boxe-c04-preview.log 2>&1 &
          for i in $(seq 1 45); do curl -fsS http://127.0.0.1:4173 -o /dev/null && exit 0; sleep 1; done
          cat /tmp/boxe-c04-preview.log; exit 1
      - name: Real Chrome C04 five-viewport and Quick Equip regression
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tools/testFieldArchiveC04Chrome.mjs
          CHROME_PATH="$CHROME" node tools/testFieldArchivePickQuickChrome.mjs
          CHROME_PATH="$CHROME" node tools/testBoxeModeEntryChrome.mjs
          CHROME_PATH="$CHROME" node tools/testBoxeNormalChrome.mjs
      # This artifact is the COMPLETE built APEX CHAOS app (not a standalone
      # Gold game). No live deployment is triggered by this workflow.
      - name: Verify complete Cloudflare playtest candidate SHA and assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {botWaveShippingAssetRefs} from './tools/botWaveShippingAssetRefs.mjs';
          const receipt=JSON.parse(fs.readFileSync('dist/CP16_BUILD_RECEIPT.json','utf8'));
          assert.equal(receipt.gitCommit, process.env.GITHUB_SHA, 'Cloudflare candidate build identity mismatch');
          assert.equal(receipt.application,'APEX CHAOS');
          const game=fs.readFileSync('dist/bot-wave/game.html','utf8');
          const proof=JSON.parse(fs.readFileSync('docs/boxe/BOT_WAVE_R5_EXTERNAL_ASSETS_PROOF.json','utf8'));
          const sha=crypto.createHash('sha256').update(game).digest('hex');
          assert.equal(sha,proof.externalized_sha256,'Gold wave executable bytes drifted');
          const refs=botWaveShippingAssetRefs(game);
          assert.ok(refs.length>=15,'BOT WAVE Arsenal gun and SFX dependencies must be present');
          for(const asset of refs)assert.ok(fs.existsSync('dist'+asset), 'Missing shipping dependency '+asset);
          assert.equal(proof.externalized_sha256,sha,'Release proof and runtime disagree');
          assert.equal(proof.substitutions.length,10,'Gold sprite list incomplete');
          for(const sprite of proof.substitutions){
            const asset='dist/assets/boxe-gold/'+sprite.file;
            assert.ok(fs.existsSync(asset),'Missing Gold PNG '+sprite.file);
            assert.equal(crypto.createHash('sha256').update(fs.readFileSync(asset)).digest('hex'),
              sprite.sha256,'Gold PNG changed '+sprite.file);
          }
          assert.ok(fs.existsSync('dist/gold/shell.html'),'Missing APEX HOME');
          console.log('CLOUDFLARE UPLOAD CANDIDATE PASS: Git SHA',receipt.gitCommit,
            '15 real gun/SFX refs, 10 Gold sprites, HOME+BOT WAVE+normal Arsenal');
          NODE
      - name: Upload APEX CHAOS Cloudflare candidate (NOT deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: boxe-r5-apex-cloudflare-playtest-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
      - name: Upload C04 regression evidence, no source snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boxe-r2-c04-chrome-check
          path: |
            docs/field-archive/candidate03/
            docs/field-archive/pick-quick-equip/
            docs/boxe/normal-browser/
            docs/boxe/r5-browser/
          retention-days: 14

  # Isolated owner preview: publish ONLY after the actual 41-weapon native
  # execution/Gold Chrome and C04 full product regression have both passed.
  # Cloudflare production is main; this writes a named non-production branch.
  deploy-boxe-owner-preview:
    needs: [bot-wave-41-native-smoke, semantic-and-c04-regression]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: aa522f5ea2f3ab8ddf94970df6821411
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve exact already-verified APEX product build
        uses: actions/download-artifact@v4
        with:
          name: boxe-r5-apex-cloudflare-playtest-${{ github.sha }}
          path: dist
      - name: Verify identity and BOT WAVE runtime closure
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/CP16_BUILD_RECEIPT.json
          test -s dist/bot-wave/game.html
          test -s dist/game/bot-wave/waveCampaign.js
          test -s dist/game/bot-wave/nativeArsenalGoldBridge.js
          test -s dist/game/bot-wave/botWavePresentationV2.css
          test -s dist/gold/shell.html
          node -e "const j=require('./dist/CP16_BUILD_RECEIPT.json');if(j.gitCommit!==process.env.GITHUB_SHA)throw Error('STALE_BOXE_BUILD')"
          printf '%s' "$GITHUB_SHA" > dist/BOT_WAVE_OWNER_SHA.txt
      - name: Deploy non-production BOT WAVE branch only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
          npx --yes wrangler@4 pages deploy dist --project-name=apex-chaos --branch=boxe-bot-wave-playtest --commit-dirty=true
      - name: Verify exact SHA serving at owner playtest URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://boxe-bot-wave-playtest.apex-chaos.pages.dev/BOT_WAVE_OWNER_SHA.txt'
          for i in $(seq 1 20); do
            GOT="$(curl --silent --show-error --location --max-time 18 "$URL" || true)"
            if [ "$GOT" = "$GITHUB_SHA" ]; then
              echo "BOT WAVE OWNER PREVIEW READY at https://boxe-bot-wave-playtest.apex-chaos.pages.dev/"
              echo "SHA VERIFIED: $GOT"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Non-production preview is not serving the exact reviewed SHA"
          exit 1
