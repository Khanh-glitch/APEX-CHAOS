name: Maintenance - compare inherited locomotion smoke
on:
  push:
    branches: [maintenance/readme-repository-cleanup-20261117]
    paths: [tools/maintenance/compare-smoke.trigger]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c72d8df7eb09492eafa0dcfaf7d17bf164c6168
          clean: true
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'pnpm'}
      - run: pnpm install --frozen-lockfile
      - name: Smoke against unchanged original main
        run: |
          mkdir -p /tmp/hero-smoke-proof
          set +e
          node tools/smokeHeroReworkHeadless.mjs > /tmp/hero-smoke-proof/baseline.log 2>&1
          code=$?
          set -e
          echo "BASELINE_EXIT=$code"
          grep -E '(^FAIL  |FAILURES:|HERO REWORK SMOKE)' /tmp/hero-smoke-proof/baseline.log || true
      - uses: actions/checkout@v4
        with:
          ref: maintenance/readme-repository-cleanup-20261117
          clean: true
      - run: pnpm install --frozen-lockfile
      - name: Smoke against cleanup candidate without changing combat source
        run: |
          set +e
          node tools/smokeHeroReworkHeadless.mjs > /tmp/hero-smoke-proof/candidate.log 2>&1
          code=$?
          set -e
          echo "CANDIDATE_EXIT=$code"
          grep -E '(^FAIL  |FAILURES:|HERO REWORK SMOKE)' /tmp/hero-smoke-proof/candidate.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: inherited-smoke-baseline-versus-cleanup
          path: /tmp/hero-smoke-proof/
          retention-days: 3
