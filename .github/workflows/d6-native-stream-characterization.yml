name: D6 Native Stream Owner-Law Candidate Gameplay
on:
  pull_request:
    paths:
      - 'public/game/hero-rework/crystalGameplayRuntime.js'
      - 'public/game/arsenal/arsenalWeaponRuntime.js'
      - 'tools/testOwnerD6StreamLiveGap.mjs'
      - 'tools/testOwnerD6GenericStreamContacts.mjs'
      - 'tools/world-ontology/attackCarrierContact.reference.mjs'
      - '.github/workflows/d6-native-stream-characterization.yml'
  workflow_dispatch:

jobs:
  real-stream-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Syntax of characterization harness
        run: |
          node --check tools/testOwnerD6StreamLiveGap.mjs
          node --check tools/testOwnerD6GenericStreamContacts.mjs
          node --check tools/world-ontology/attackCarrierContact.reference.mjs
      - name: Derive exact changed artifact SHA-256 and bytes for fail-closed revision lock
        run: |
          sha256sum public/game/arsenal/arsenalWeaponRuntime.js public/game/hero-rework/crystalGameplayRuntime.js public/gold/shell.html
          wc -c public/gold/shell.html
      - name: Generic Stream and Beam material semantics (REFERENCE ONLY)
        run: node tools/testOwnerD6GenericStreamContacts.mjs
      - name: Real Arsenal Flame owner-law proof (Wall, HEXA, reflected source, breaking tick)
        run: node tools/testOwnerD6StreamLiveGap.mjs
      - name: Existing V43 damage/gold flame mechanics contracts
        run: node tools/testV43PostUpdateContracts.mjs
