name: D6 Native Stream Owner-Law Candidate Gameplay
on:
  pull_request:
    paths:
      - 'public/game/hero-rework/crystalGameplayRuntime.js'
      - 'public/game/arsenal/arsenalWeaponRuntime.js'
      - 'src/game/runtimeManifest.js' # SHA-pinned D5+D6 integration rechecks native Stream
      - 'tools/testOwnerD6StreamLiveGap.mjs'
      - 'tools/testOwnerD6GenericStreamContacts.mjs'
      - 'tools/testOwnerD6NativeGoldFlameRoutes.mjs'
      - 'tools/testOwnerD6NativeStreamChrome.mjs'
      - 'tools/testOwnerD6HexaChrome.mjs'
      - 'tools/world-ontology/attackCarrierContact.reference.mjs'
      - 'public/game/arsenal/arsenalConfig.js'
      - 'public/game/arsenal/arsenalIdentityRuntime.js'
      - 'public/game/arsenal/arsenalSpawnRuntime.js'
      - 'public/game/hero-rework/ailRuntime.js'
      - 'public/game/hero-rework/heroRegistry.js'
      - 'tools/testV43PostUpdateContracts.mjs'
      - '.github/workflows/d6-native-stream-characterization.yml'
  workflow_dispatch:

jobs:
  real-stream-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Syntax of characterization harness
        run: |
          node --check tools/testOwnerD6StreamLiveGap.mjs
          node --check tools/testOwnerD6GenericStreamContacts.mjs
          node --check tools/testOwnerD6NativeGoldFlameRoutes.mjs
          node --check tools/world-ontology/attackCarrierContact.reference.mjs
      - name: Derive exact changed artifact SHA-256 and bytes for fail-closed revision lock
        run: |
          sha256sum public/game/arsenal/arsenalWeaponRuntime.js public/game/hero-rework/crystalGameplayRuntime.js public/gold/shell.html
          wc -c public/gold/shell.html
      - name: Exact new runtime revision + Gold source cutover consistency
        run: |
          pnpm test:runtime-revision
          node tools/testGoldB05PatchRevision.mjs
          node tools/buildGoldCutover.mjs --check
      - name: Generic Stream and Beam material semantics (REFERENCE ONLY)
        run: node tools/testOwnerD6GenericStreamContacts.mjs
      - name: Original Gold Flame source-route control and reflection visual witness
        run: node tools/testOwnerD6NativeGoldFlameRoutes.mjs
      - name: Real Arsenal Flame owner-law proof (Wall, HEXA, reflected source, breaking tick)
        run: node tools/testOwnerD6StreamLiveGap.mjs
      - name: Existing V43 damage/gold flame mechanics contracts
        run: node tools/testV43PostUpdateContracts.mjs

  real-chrome-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install QA-only Chrome driver without updating committed lockfile
        run: pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
      - name: Actual desktop/mobile Chrome native Stream gameplay and Canvas
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME_PATH="$CHROME"
          export APEX_APP_URL=http://127.0.0.1:5173/
          export APEX_EVIDENCE_DIR=/tmp/d6-native-stream-browser
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/d6-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null 2>&1; then break; fi
            sleep .5
          done
          node tools/testOwnerD6NativeStreamChrome.mjs
          node tools/testOwnerD6HexaChrome.mjs
      - name: Attach original desktop/mobile Canvas evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d6-native-stream-chrome-${{ github.sha }}
          path: /tmp/d6-native-stream-browser/
          if-no-files-found: warn
          retention-days: 7
