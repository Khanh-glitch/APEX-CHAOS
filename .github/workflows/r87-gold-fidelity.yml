name: R87 True Gold Design-Viewport Fidelity

on:
  push:
    branches:
      - arena/r87-gold-fidelity-virtual-viewport
    paths:
      - '.github/workflows/r87-gold-fidelity.yml'
      - 'tools/testR87GoldFidelityBrowser.mjs'
      - 'public/gold-fidelity-lab.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Sparse checkout full authentic game and fidelity test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            public/apexEngine.js
            public/game
            public/gold
            public/gold-fidelity-lab.html
            public/assets/audio
            public/assets/gold-ui
            public/assets/loading
            public/assets/pick_ui_final
            public/assets/ui
            public/assets/ui_2026
            public/assets/fonts
            tools/testR87GoldFidelityBrowser.mjs
            index.html
            package.json
            pnpm-lock.yaml
            vite.config.js
          sparse-checkout-cone-mode: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm 9 locked
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Prove Gold design-space invariant and real pointer mapping
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/r87-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/gold-fidelity-lab.html >/dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:5173/ node tools/testR87GoldFidelityBrowser.mjs
      - name: Preserve original-versus-scaled screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r87-gold-true-fidelity-evidence
          path: |
            docs/acceptance/r87-gold-fidelity/
            /tmp/r87-vite.log
          if-no-files-found: warn
