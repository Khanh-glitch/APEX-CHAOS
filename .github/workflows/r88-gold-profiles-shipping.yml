name: R88 Native Gold Profiles Production Packaging

on:
  workflow_dispatch:
  push:
    branches:
      - arena/r88-gold-profile-fidelity
    paths:
      - '.github/workflows/r88-gold-profiles-shipping.yml'
      - 'public/gold-fidelity-lab.html'
      - 'public/gold-fidelity-profiles.mjs'
      - 'tools/testR87GoldFidelityBrowser.mjs'
      - 'src/App.jsx'
      - 'src/main.jsx'
      - 'src/game/shortPortraitPickRuntime.js'
      - 'src/game/shortPortraitPick.css'
      - 'src/game/shortPortraitPickSolver.js'
      - 'src/game/bootStartViewportGuard.js'
      - 'tools/testR85RuntimeGeometry.mjs'
      - 'tools/goldShellR85.mjs'
      - 'tools/goldBattleHudR85.mjs'
      - 'tools/buildGoldCutover.mjs'
      - 'public/gold/battle-hud.html'
      - 'public/gold/shell.html'
      - 'public/gold/manifest.json'
      - 'src/game/goldAssetManifest.js'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse shallow clone of complete R85 shipping sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax-check both R86 source adapters
        run: |
          node --check tools/goldShellR83.mjs
          node --check tools/goldBattleHudR83.mjs
          node --check src/game/shortPortraitPickSolver.js
          node --check src/game/shortPortraitPickRuntime.js
          node --check src/game/bootStartViewportGuard.js
      - name: Verify committed Gold equals canonical generated output
        run: node tools/buildGoldCutover.mjs --check
      - name: Independently regenerate Gold and reject ANY tracked drift
        shell: bash
        run: |
          set -euo pipefail
          node tools/buildGoldCutover.mjs
          git diff --exit-code -- public/gold src/game/goldAssetManifest.js
          node tools/buildGoldCutover.mjs --check
      - name: Upload deterministic Gold source outputs for controlled synchronization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r88-verified-gold
          path: |
            public/gold/shell.html
            public/gold/battle-hud.html
            public/gold/manifest.json
            src/game/goldAssetManifest.js
          if-no-files-found: warn
      - name: Verify R86 START and Fighter Pick math authority
        run: node tools/testR85RuntimeGeometry.mjs
      - name: Verify R82 opt-in feature is still isolated
        run: node tools/testR82HomeLayoutLab.mjs
      - name: Build shipping game
        run: pnpm build
      - name: Confirm Gold fidelity lab is included in the FINAL shipped dist
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/gold-fidelity-lab.html
          test -s dist/index.html
          test -s dist/gold-fidelity-profiles.mjs
          grep -q 'gold-fidelity-profiles.mjs' dist/gold-fidelity-lab.html
          echo "PASS R88: native Gold, complete real game and 8-profile fixed viewport registry included"
      - name: Verify shipped bundle
        run: pnpm test:shipping-dist
      - name: Publish candidate ZIP as artifact (not production deploy)
        uses: actions/upload-artifact@v4
        with:
          name: r88-gold-profiles-game
          path: dist/
          retention-days: 7
          if-no-files-found: error
