name: Quest Q5p E04 Weapon Rain genuine integration
on:
  push:
    branches: ['quest/q5p-e04-weapon-rain-from-e03']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e04-native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm arsenal:sfx:materialize
      - name: Original Quest Q1 and Q2 authority gates
        run: |
          node tools/testQuestDirectorQ1.mjs
          node tools/testQuestGenericRosterQ2.mjs
      - name: E03 physical roster and no-fake KO regression
        run: node tools/testQuestScrapSwarmQ5.mjs
      - name: E04 1v2 real outcome and rain phase scheduler
        run: node tools/testQuestWeaponRainQ5.mjs
      - name: E04 real Arsenal gun and cap integration
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-weapon-rain-native
      - name: Production build
        run: pnpm build
      - name: Start real Gold Vite shell
        shell: bash
        run: |
          pnpm dev:lan > /tmp/quest-e04-vite.log 2>&1 &
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/quest-e04-vite.log
          exit 1
      - name: Find Chrome executable
        id: chrome
        shell: bash
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Chrome desktop E01–E04 true checkpoint gameplay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/quest-e04
        run: node tools/testQuestDirectorQ1Browser.mjs
      - name: Chrome mobile-touch E01–E04 true checkpoint gameplay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          APEX_EVIDENCE_DIR: /tmp/quest-e04
        run: node tools/testQuestDirectorQ1Browser.mjs --mobile
      - name: Save real Gold screenshots/telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-q5p-e04-authentic-chrome-evidence
          path: |
            /tmp/quest-e04/
            /tmp/quest-e04-vite.log
          if-no-files-found: warn
