name: R86 Home Geometry Solver Laboratory

on:
  push:
    branches:
      - arena/r86-home-geometry-solver-lab
    paths:
      - '.github/workflows/r86-home-geometry-lab.yml'
      - 'tools/goldBattleHudR83.mjs'
      - 'tools/testR86HomeGeometryBrowser.mjs'
      - 'src/App.jsx'
      - 'tools/buildGoldCutover.mjs'
      - 'public/gold/battle-hud.html'
      - 'public/gold/shell.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Sparse checkout of real generated Battle HUD and browser test
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            public/apexEngine.js
            public/game
            public/gold
            public/assets/audio
            public/assets/gold-ui
            public/assets/loading
            public/assets/pick_ui_final
            public/assets/ui
            public/assets/ui_2026
            public/assets/fonts
            tools/testR86HomeGeometryBrowser.mjs
            index.html
            package.json
            pnpm-lock.yaml
            vite.config.js
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run R78 Home authority before/after solver in real Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/r86-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/gold/battle-hud.html >/dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:5173/ node tools/testR86HomeGeometryBrowser.mjs
      - name: Upload comparison images and geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r86-home-geometry
          path: |
            docs/acceptance/r86-home-geometry/
            /tmp/r86-vite.log
          if-no-files-found: warn
