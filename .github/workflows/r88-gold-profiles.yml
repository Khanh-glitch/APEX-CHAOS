name: R88 Preserve All Existing Gold Layout Families

on:
  push:
    branches:
      - arena/r88-gold-profile-fidelity
    paths:
      - '.github/workflows/r88-gold-profiles.yml'
      - 'public/gold-fidelity-lab.html'
      - 'public/gold-fidelity-profiles.mjs'
      - 'tools/testR88GoldProfilesBrowser.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Sparse checkout real game including all Gold art and native HUD layouts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            src
            public/apexEngine.js
            public/game
            public/gold
            public/gold-fidelity-lab.html
            public/gold-fidelity-profiles.mjs
            public/assets/audio
            public/assets/gold-ui
            public/assets/loading
            public/assets/pick_ui_final
            public/assets/ui
            public/assets/ui_2026
            public/assets/fonts
            tools/testR88GoldProfilesBrowser.mjs
            index.html
            package.json
            pnpm-lock.yaml
            vite.config.js
          sparse-checkout-cone-mode: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Compare eight Gold composition references at full and 60 percent size
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/r88-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/gold-fidelity-profiles.mjs >/dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:5173/ node tools/testR88GoldProfilesBrowser.mjs
      - name: Upload native Gold comparisons and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r88-native-gold-fidelity-evidence
          path: |
            docs/acceptance/r88-gold-profiles/
            /tmp/r88-vite.log
          if-no-files-found: warn
