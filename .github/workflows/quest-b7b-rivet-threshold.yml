name: B7b Authentic RIVET Nonlethal Boss Threshold Contract
on:
  push:
    branches: ['quest/b7b-rivet-threshold-contract-from-b6j']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boss-thresholds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm arsenal:sfx:materialize
      - name: B7b genuine damage thresholds and locked 180HP floor
        run: node tools/testQuestRivetThresholdB7a.mjs
      - name: B6 E06 native continuity
        run: |
          node tools/testQuestBreachPolicyQ6.mjs
          node tools/testQuestBreachLifecycleB6d.mjs
          node tools/testQuestBreachRetreatB6e.mjs
          node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-breach-native
      - name: Gold generated assets check
        run: node tools/buildGoldCutover.mjs --check
      - name: Production build
        run: pnpm build
