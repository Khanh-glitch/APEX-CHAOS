name: Deep Source-Prune Audit
on:
  push:
    branches: [maintenance/hard-source-prune-20261117]
    paths:
      - '.github/workflows/deep-source-prune-audit.yml'
      - 'tools/maintenance/hardPruneAudit.mjs'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build actual shipping graph
        run: pnpm build
      - name: Inventory deployed files and source references
        run: node tools/maintenance/hardPruneAudit.mjs
      - name: Commit audit manifest to maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/hard-prune-audit.json
          git commit -m "audit(temporary): capture exact production asset inventory"
          git push origin HEAD:maintenance/hard-source-prune-20261117
      - uses: actions/upload-artifact@v4
        with:
          name: hard-source-prune-audit
          path: reports/hard-prune-audit.json
          retention-days: 4
