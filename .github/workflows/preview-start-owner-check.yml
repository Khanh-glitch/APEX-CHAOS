name: Owner Preview START Chrome (desktop and Android)
on:
  pull_request:
    paths:
      - 'tools/testOwnerPreviewStartChrome.mjs'
      - 'tools/testOwnerBootPlatformInjectionChrome.mjs'
      - 'src/App.jsx'
      - '.github/workflows/preview-start-owner-check.yml'
  workflow_dispatch:
jobs:
  actual-preview-entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated Chrome QA driver
        run: pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
      - name: Build exact production payload for provider-injection regression
        run: pnpm run build
      - name: Run local production Chrome with Netlify-like duplicate script
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/apex-preview-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tools/testOwnerBootPlatformInjectionChrome.mjs
      - name: Verify Netlify PR 65 actual boot entrypoints (not Vite dev)
        env:
          APEX_PREVIEW_URL: https://deploy-preview-65--apexchaos.netlify.app/
          APEX_EVIDENCE_DIR: /tmp/apex-preview-start
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tools/testOwnerPreviewStartChrome.mjs
      - name: Preserve viewport screenshots and failure telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-preview-start-diagnostics-${{ github.sha }}
          path: /tmp/apex-preview-start/
          if-no-files-found: warn
          retention-days: 7
