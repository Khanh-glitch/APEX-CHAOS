name: Owner Gold Direct-Port Acceptance

on:
  pull_request:
    paths:
      - 'gold-mission-account/**'
      - 'src/ui/GoldMissionAccountHost.jsx'
      - 'src/ui/ProductSessionNavigator.jsx'
      - 'src/ui/productSessionNavigation.css'
      - 'src/game/cosmetics/FieldArchiveC03.jsx'
      - 'src/App.jsx'
      - 'tools/buildGoldMissionAccount.mjs'
      - 'tools/verifyGoldSourceParity.mjs'
      - 'tools/testOwnerGoldDirectPortBrowser.mjs'
      - 'tools/testGoldSwipeNavigationBrowser.mjs'
      - 'tools/testSessionFiveWayBrowser.mjs'
      - '.github/workflows/gold-direct-port-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install game dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser probe
        run: npm --prefix tools/probe ci --no-audit --no-fund
      - name: Verify exact Gold owner-source hashes
        run: node tools/verifyGoldSourceParity.mjs
      - name: Build actual pruned distribution and standalone Gold
        run: pnpm build
      - name: Shipping dist and cutover contract
        run: |
          pnpm test:shipping-dist
          pnpm test:gold-direct-port
          test -s dist/gold/mission-account.html
      - name: Test actual browser at 4 viewports
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/apex-gold-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/gold/mission-account.html > /dev/null; then break; fi
            sleep 1
          done
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:4173/ node tools/testOwnerGoldDirectPortBrowser.mjs
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:4173/ node tools/testGoldSwipeNavigationBrowser.mjs
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:4173/ node tools/testSessionFiveWayBrowser.mjs
      - name: Upload owner Gold screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-gold-direct-port-${{ github.sha }}
          path: |
            reports/owner-gold-evidence/
            reports/owner-gold-swipe-evidence/
            reports/five-session-navigation/
            /tmp/apex-gold-preview.log
          if-no-files-found: warn
          retention-days: 14
