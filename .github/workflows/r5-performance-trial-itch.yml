name: R5 performance trial itch artifact
on:
  push:
    branches: [fix/r5-performance-trial-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_APEX_DEV_ADMIN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Graphics mode source guards
        run: |
          node --check src/game/graphicsMode.js
          node tools/testR5GraphicsModeContract.mjs
      - name: Product and battle gates
        run: |
          node tools/testBotWaveNativeParity.mjs
          node tools/testBotWaveLosslessR5.mjs
          node tools/testBotWaveR7NativePhysics.mjs
          node tools/testBotWavePressureWasmParity.mjs
          node tools/testOwnerShortcutCapture.mjs
          node tools/testOwnerStudioSfxPolicy.mjs
      - name: Build exact R5 code
        run: |
          pnpm build
          pnpm test:shipping-dist
          test -s dist/index.html
          test -s dist/bot-wave/game.html
      - name: Package nested itch copy
        run: |
          echo "$GITHUB_SHA" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/bot-wave/game.html
          (cd dist-itch-html5 && zip -qr -9 ../APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.zip .)
          unzip -tq APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.zip
          unzip -Z1 APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.zip | grep -qx index.html
          sha256sum APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.zip > APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.sha256
      - name: Browser packaged-game smoke
        run: |
          npm ci --prefix tools/probe --ignore-scripts
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node tools/testOwnerItchPackagedChrome.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-r5-performance-trial-${{ github.sha }}
          path: |
            APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.zip
            APEX-CHAOS-R5-PERFORMANCE-TRIAL-ITCH.sha256
            reports/owner-itch-qa/
          if-no-files-found: warn
