name: VIE ENG Localization Gates
on:
  pull_request:
    paths:
      - 'src/game/localeCatalog.js'
      - 'src/game/localeAwardRules.js'
      - 'src/game/localizationRuntime.js'
      - 'src/game/localization.css'
      - 'public/gold/fonts/**'
      - 'src/main.jsx'
      - 'tools/testLocalizationGate.mjs'
      - 'tools/testLocalizationChrome.mjs'
      # The Chrome gate audits Home/Mode/Fighter Select inside the generated
      # Gold shell, so shell-affecting sources must trigger it too (the
      # portrait Fighter Select overflow lived in these files unwatched).
      - 'public/gold/shell.html'
      - 'docs/gold-ui/current/**'
      - 'tools/buildGoldCutover.mjs'
      - 'tools/goldShellR52pickBand.mjs'
      - 'package.json'
      - '.github/workflows/localization-gates.yml'
  workflow_dispatch:
jobs:
  locale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:localization
      - run: pnpm build
      - name: Verify shipped Vietnamese font and OFL notice
        shell: bash
        run: |
          set -euo pipefail
          FONT=dist/gold/fonts/apex-oswald-vietnamese.ttf
          LICENSE=dist/gold/fonts/APEX-OSWALD-OFL.txt
          test -s "$FONT"
          test -s "$LICENSE"
          test "$(git hash-object "$FONT")" = 'd1a3b9cb1325bf20b3a06ef9849d21c411212a3b'
          test "$(git hash-object "$LICENSE")" = '4d4e319b6114be0174e6de5d8090408f78dc65b8'
      - name: Verify real Chrome desktop and portrait glyphs
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/apex-localization-vite.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:5173/ node tools/testLocalizationChrome.mjs
      - name: Upload VIE ENG browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-chrome-visual-evidence
          path: docs/acceptance/localization
          if-no-files-found: warn
