name: VIE ENG Localization Gates
on:
  pull_request:
    paths:
      - 'src/game/localeCatalog.js'
      - 'src/game/localeAwardRules.js'
      - 'src/game/localizationRuntime.js'
      - 'src/game/localization.css'
      - 'src/main.jsx'
      - 'tools/testLocalizationGate.mjs'
      - 'tools/testLocalizationChrome.mjs'
      - 'package.json'
      - '.github/workflows/localization-gates.yml'
  workflow_dispatch:
jobs:
  locale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:localization
      - run: pnpm build
      - name: Verify real Chrome desktop and portrait glyphs
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          pnpm exec vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/apex-localization-vite.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then READY=1; break; fi
            sleep 1
          done
          test "$READY" = 1
          CHROME_PATH="$CHROME" APEX_APP_URL=http://127.0.0.1:5173/ node tools/testLocalizationChrome.mjs
      - name: Upload VIE ENG browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-chrome-visual-evidence
          path: docs/acceptance/localization
          if-no-files-found: warn
