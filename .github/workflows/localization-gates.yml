name: VIE ENG Localization Gates
on:
  pull_request:
    paths:
      - 'src/game/localeCatalog.js'
      - 'src/game/localizationRuntime.js'
      - 'src/game/localization.css'
      - 'src/main.jsx'
      - 'tools/testLocalizationGate.mjs'
      - 'package.json'
      - '.github/workflows/localization-gates.yml'
  workflow_dispatch:
jobs:
  locale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:localization
      - run: pnpm build
