name: R83 Candidate Source and Shipping Proof

on:
  workflow_dispatch:
  push:
    branches:
      - arena/r83-local-portrait-layout-solver
    paths:
      - '.github/workflows/r83-candidate-shipping.yml'
      - 'tools/goldShellR83.mjs'
      - 'tools/goldBattleHudR83.mjs'
      - 'tools/buildGoldCutover.mjs'
      - 'public/gold/battle-hud.html'
      - 'public/gold/shell.html'

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sparse shallow clone of complete R83 shipping sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Syntax-check both R83 source adapters
        run: |
          node --check tools/goldShellR83.mjs
          node --check tools/goldBattleHudR83.mjs
      - name: Regenerate canonical Gold in runner and audit source changes
        shell: bash
        run: |
          set -euo pipefail
          node tools/buildGoldCutover.mjs
          git diff --name-only > /tmp/r83-generator-changed-paths.txt
          cat /tmp/r83-generator-changed-paths.txt
          while IFS= read -r path; do
            case "$path" in
              public/gold/shell.html|public/gold/manifest.json|src/game/goldAssetManifest.js) ;;
              *) echo "::error::Unexpected Gold generator drift in $path"; exit 1 ;;
            esac
          done < /tmp/r83-generator-changed-paths.txt
          node tools/buildGoldCutover.mjs --check
      - name: Upload deterministic Gold source outputs for controlled synchronization
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83-regenerated-gold-evidence
          path: |
            public/gold/shell.html
            public/gold/battle-hud.html
            public/gold/manifest.json
            src/game/goldAssetManifest.js
          if-no-files-found: warn
      - name: Verify R82 opt-in feature is still isolated
        run: node tools/testR82HomeLayoutLab.mjs
      - name: Build shipping game
        run: pnpm build
      - name: Verify shipped bundle
        run: pnpm test:shipping-dist
      - name: Publish candidate ZIP as artifact (not production deploy)
        uses: actions/upload-artifact@v4
        with:
          name: r83-shipping-candidate
          path: dist/
          retention-days: 7
          if-no-files-found: error
