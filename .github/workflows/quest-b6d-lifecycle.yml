name: B6d Breach Real KO Wave Lifecycle Contract
on:
  push:
    branches: ['quest/b6d-breach-wave-lifecycle-from-b5g']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: node tools/testQuestBreachPolicyQ6.mjs
      - run: node tools/testQuestBreachLifecycleB6d.mjs
      - run: node tools/testQuestScrapSwarmQ5.mjs
      - run: node tools/buildGoldCutover.mjs --check
      - run: pnpm build
