name: CP16 Cloudflare Owner Preview (isolated branch)
on:
  push:
    branches:
      - 'arena/cp16-atomic-cache-release-candidate-20261014'
    paths:
      - '.github/workflows/cp16-cloudflare-owner-preview.yml'
      - 'src/game/runtimeManifest.js'
      - 'src/game/goldAssetManifest.js'
      - 'public/gold/**'
      - 'tools/runtimeRevision.lock.json'
      - 'tools/testCP16AtomicRelease.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: aa522f5ea2f3ab8ddf94970df6821411
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PREVIEW_BASE: https://cp16-atomic-release-20261014.apex-chaos.pages.dev
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated preview credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is missing: owner must configure the Cloudflare Pages GitHub secret."
            exit 1
          }
      - name: Verify immutable source/generator admission before deployment
        run: |
          node tools/testCP16AtomicRelease.mjs
          node tools/testRuntimeRevisionGate.mjs
          node tools/testGoldRevisionIntegrityGate.mjs
          node tools/buildGoldCutover.mjs --check
      - name: Build and stamp exact GitHub commit
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build
          node tools/testShippingDist.mjs
          printf '%s\n' "$GITHUB_SHA" > dist/CP16_BUILD_SHA.txt
          printf '%s\n' '20261014-cp16-atomic-release-r1' > dist/CP16_RELEASE_REVISION.txt
      - name: Deploy ONLY the named Cloudflare preview branch (never production)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name=apex-chaos \
            --branch=cp16-atomic-release-20261014 \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true 2>&1 | tee /tmp/cp16-pages-deploy.log
      - name: Verify live preview serves exactly the workflow HEAD and Gold revision
        shell: bash
        run: |
          set -euo pipefail
          PASS=0
          for i in $(seq 1 30); do
            LIVE="$(curl --max-time 15 -fLsS "$PREVIEW_BASE/CP16_BUILD_SHA.txt" 2>/dev/null || true)"
            REV="$(curl --max-time 15 -fLsS "$PREVIEW_BASE/CP16_RELEASE_REVISION.txt" 2>/dev/null || true)"
            if [ "$LIVE" = "$GITHUB_SHA" ] && [ "$REV" = '20261014-cp16-atomic-release-r1' ]; then
              PASS=1
              break
            fi
            echo "Preview propagation attempt $i/30; SHA not verified yet"
            sleep 3
          done
          test "$PASS" = 1 || {
            echo "::error::Preview branch does not serve the exact GitHub candidate SHA/revision."
            exit 1
          }
          curl -fLsS --max-time 20 "$PREVIEW_BASE/gold/manifest.json" \
            | node -e "let d='';process.stdin.on('data',x=>d+=x);process.stdin.on('end',()=>{const v=JSON.parse(d);if(v.runtimeRevision!=='20261014-cp16-atomic-release-r1')process.exit(1);console.log('LIVE GOLD MANIFEST PASS',v.runtimeRevision)})"
          curl -fLsS --max-time 20 "$PREVIEW_BASE/" >/dev/null
          echo "VERIFIED PLAYTEST PREVIEW: $PREVIEW_BASE/"
          echo "VERIFIED COMMIT: $GITHUB_SHA"
      - name: Real Chrome desktop/Android cold/return on the live preview
        shell: bash
        run: |
          set -euo pipefail
          pnpm add -D puppeteer-core@24 --ignore-workspace-root-check
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" APEX_APP_URL="$PREVIEW_BASE/" \
            APEX_CP16_EVIDENCE_DIR=/tmp/cp16-live-preview-browser \
            node tools/testCP16ColdReturnChrome.mjs
      - name: Attach deployment and live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp16-cloudflare-owner-preview
          path: |
            /tmp/cp16-pages-deploy.log
            /tmp/cp16-live-preview-browser/
          if-no-files-found: warn
          retention-days: 14
