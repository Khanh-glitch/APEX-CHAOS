name: Arsenal Quest Stabilization

on:
  push:
    branches:
      - prototype/arsenal-quest
      - 'arena/**'

permissions:
  contents: write

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Add reproducible headless QA dependencies
        run: pnpm add -D --save-exact jsdom @napi-rs/canvas

      - name: Run headless acceptance suite
        run: |
          set +e
          pnpm test:arsenal:headless > /tmp/headless.log 2>&1
          RC=$?
          set -e
          cat /tmp/headless.log
          exit $RC

      - name: Build production bundle
        run: pnpm build

      - name: Upload playable production build
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-quest-production-build
          path: dist/
          if-no-files-found: error

      - name: Assemble packaged app for launcher smoke test
        shell: bash
        run: |
          rm -rf release/arsenal-quest-windows/app
          cp -r dist release/arsenal-quest-windows/app
          git rev-parse HEAD > release/arsenal-quest-windows/app/ARSENAL_BUILD_SHA.txt
          echo "assembled app with SHA $(cat release/arsenal-quest-windows/app/ARSENAL_BUILD_SHA.txt)"

      - name: Smoke-test packaged launcher server (pwsh)
        shell: bash
        run: |
          cd release/arsenal-quest-windows
          trap 'mkdir -p ../../docs/arsenal-quest/ci-logs; cp /tmp/serve1.log /tmp/serve2.log ../../docs/arsenal-quest/ci-logs/ 2>/dev/null || true' EXIT
          command -v pwsh || { echo "FATAL: pwsh not available"; exit 1; }
          pwsh --version
          SHA=$(cat app/ARSENAL_BUILD_SHA.txt)
          pwsh -NoProfile -File serve.ps1 > /tmp/serve1.log 2>&1 &
          S1=$!
          for i in $(seq 1 30); do grep -q "URL       :" /tmp/serve1.log && break; sleep 1; done
          cat /tmp/serve1.log
          PORT1=$(sed -n 's|.*localhost:\([0-9]*\)/.*|\1|p' /tmp/serve1.log | head -1)
          if [ -z "$PORT1" ]; then echo "launcher failed to print URL"; exit 1; fi
          SERVED_SHA=$(curl -fsS "http://localhost:$PORT1/ARSENAL_BUILD_SHA.txt")
          echo "served SHA=$SERVED_SHA expected=$SHA"
          test "$SERVED_SHA" = "$SHA"
          curl -fsSI "http://localhost:$PORT1/" | grep -i cache-control | grep -i no-store
          curl -fsS "http://localhost:$PORT1/" | grep -q 'id="root"'
          curl -fsS "http://localhost:$PORT1/assets/arsenal/av/vfx/muzzle_flash/muzzleFlash0_transparent.png" -o /dev/null
          pwsh -NoProfile -File serve.ps1 > /tmp/serve2.log 2>&1 &
          S2=$!
          for i in $(seq 1 30); do grep -q "URL       :" /tmp/serve2.log && break; sleep 1; done
          PORT2=$(sed -n 's|.*localhost:\([0-9]*\)/.*|\1|p' /tmp/serve2.log | head -1)
          echo "ports: $PORT1 $PORT2"
          if [ -z "$PORT2" ] || [ "$PORT2" = "$PORT1" ]; then echo "stale/fixed port collision!"; exit 1; fi
          kill $S1 $S2 2>/dev/null || true
          echo "LAUNCHER SMOKE OK"

      - name: Start Apex dev server
        shell: bash
        run: |
          pnpm dev >/tmp/apex-vite.log 2>&1 &
          echo $! >/tmp/apex-vite.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/apex-vite.log
          exit 1

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium found on runner."
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"
          "$CHROME" --version

      - name: Run real-browser Arsenal acceptance suite
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_APP_URL: http://127.0.0.1:5173
          AQ_EVIDENCE_DIR: docs/arsenal-quest/browser-evidence
        run: |
          set +e
          pnpm test:arsenal > /tmp/browser.log 2>&1
          RC=$?
          set -e
          cat /tmp/browser.log
          exit $RC

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-quest-browser-evidence
          path: |
            docs/arsenal-quest/browser-evidence/
            /tmp/apex-vite.log
          if-no-files-found: warn

      - name: Commit browser evidence and CI logs for in-repo review
        if: always()
        shell: bash
        run: |
          mkdir -p docs/arsenal-quest/ci-logs
          cp /tmp/headless.log /tmp/browser.log /tmp/apex-vite.log docs/arsenal-quest/ci-logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/arsenal-quest/browser-evidence docs/arsenal-quest/ci-logs docs/arsenal-quest/evidence/headless-test-report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No browser evidence changes."
          else
            git commit -m "chore(arsenal): refresh real-browser evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Commit reproducible QA dependencies
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency metadata changes required."
          else
            git commit -m "test: make Arsenal headless QA reproducible [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
