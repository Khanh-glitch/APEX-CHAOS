name: V43 Gold Source Integrity (visual parity advisory)

on:
  pull_request:
    paths:
      - 'public/game/arsenal/**'
      - 'public/game/modes/arsenalBattleRuntime.js'
      - 'public/game/hero-rework/**'
      - 'tools/testOwnerV43Gold*.mjs'
      - 'tools/testOwnerV43BoomerangNaturalFlight.mjs'
      - 'tools/testOwnerV43GoldCertification.mjs'
      - 'tools/maintenance/v43-gold-reference-preflight.mjs'
      - 'docs/maintenance/V43_GOLD_40_PHASE_EVIDENCE_BACKLOG_2026-10-10.json'
      - '.github/workflows/v43-gold-fidelity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gold-fidelity:
    name: V43 source invariants (40 visual phases advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate 40-phase inventory and emit non-certifying reference preflight
        run: node tools/maintenance/v43-gold-reference-preflight.mjs --out /tmp/v43-gold-evidence-preflight.json
      # Owner scope 2026-10-13: eight V4.3 visuals are accepted as sufficient
      # for the current systems cutover. Keep seven executable SOURCE guards
      # fail-closed and publish the honest 0/40 visual comparison inventory,
      # but do not claim pixel/motion certification or block systems release.
      # Strict comparison remains available explicitly:
      # node tools/testOwnerV43GoldCertification.mjs --strict
      - name: Enforce seven executable V43 source proofs; report visual backlog
        run: node tools/testOwnerV43GoldCertification.mjs
      - name: Retain Gold evidence preflight even when strict certification blocks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v43-gold-evidence-preflight
          path: /tmp/v43-gold-evidence-preflight.json
          if-no-files-found: warn
