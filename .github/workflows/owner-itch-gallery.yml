name: Capture Actual Itch Game Gallery
on:
  push:
    branches:
      - feature/owner-gold-direct-port-20261026
    paths:
      - tools/captureItchMarketingGallery.mjs
      - .github/workflows/owner-itch-gallery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: ''
      VITE_SUPABASE_ANON_KEY: ''
      VITE_APEX_DEV_ADMIN: '0'
      VITE_APEX_GOOGLE_AUTH_ENABLED: '0'
      VITE_APEX_EMAIL_CODE_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact game and Chrome probe dependencies
        run: |
          pnpm install --frozen-lockfile
          npm --prefix tools/probe ci --no-audit --no-fund
      - name: Build and pack exact itch game
        run: |
          pnpm build
          test -s dist/index.html
          printf '%s\n' "$GITHUB_SHA" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
      - name: Capture real game through itch-style nested iframe in Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          CHROME_PATH="$CHROME" node tools/captureItchMarketingGallery.mjs
      - name: Upload owner gallery screenshot candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-chaos-real-itch-gallery
          path: reports/itch-gallery-candidates/
          if-no-files-found: warn
          retention-days: 14
