name: R82 Isolated Owner Preview

on:
  push:
    branches:
      - arena/r82-responsive-preservation-lab
    paths:
      - '.github/workflows/r82-owner-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: aa522f5ea2f3ab8ddf94970df6821411
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Shallow checkout of exact R82 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify R82 source isolation
        run: node tools/testR82HomeLayoutLab.mjs

      - name: Build the FULL shipping game from R82
        run: pnpm build

      - name: Check shipping bundle
        run: pnpm test:shipping-dist

      - name: Upload build for owner preview even when Cloudflare is unavailable
        uses: actions/upload-artifact@v4
        with:
          name: r82-shipping-game
          path: dist/
          retention-days: 3
          if-no-files-found: error

      - name: Ensure preview deployment credential exists
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing; no deployment performed"
            exit 1
          fi

      - name: Deploy only R82 preview branch, never production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name=apex-chaos \
            --branch=r82-responsive-lab \
            --commit-dirty=true 2>&1 | tee /tmp/r82-cloudflare-preview.log
          echo "R82 is a Cloudflare Pages preview deployment; production is unchanged."

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r82-owner-preview-evidence
          path: /tmp/r82-cloudflare-preview.log
          if-no-files-found: warn
