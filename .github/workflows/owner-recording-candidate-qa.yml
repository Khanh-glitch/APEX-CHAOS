name: R5 Portrait Recording Candidate QA (NO RELEASE)
on:
  push:
    branches:
      - fix/r5-portrait-audio-framepressure-20261106
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recording-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install lockfile dependencies
        run: pnpm install --frozen-lockfile
      - name: Regression gates — no asset loss / no codec resolution reduction
        run: |
          node --check src/game/ownerPlaytestCapture.js
          node tools/testOwnerShortcutCapture.mjs
          node tools/testOwnerStudioSfxPolicy.mjs
          node tools/testOwnerRecordingFrameBudget.mjs
      - name: Production build and shipping hygiene
        run: |
          pnpm build
          pnpm test:shipping-dist
      - name: Portable itch structure and shipped audio
        run: |
          printf '%s\n' "$(git rev-parse HEAD)" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
          node tools/testOwnerPortraitShippingAudio.mjs
      - name: Actual Chrome packaged-game and portrait recording regression
        run: |
          npm ci --prefix tools/probe --ignore-scripts
          export CHROME_PATH="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME_PATH"
          node tools/testOwnerItchPackagedChrome.mjs
          node tools/testOwnerItchCapturePolicyChrome.mjs
      - name: Package verified candidate, never overwrite r5
        run: |
          (cd dist-itch-html5 && zip -q -r -9 ../APEX-CHAOS-owner-F7-F8-recfix-rc1.zip .)
          unzip -tq APEX-CHAOS-owner-F7-F8-recfix-rc1.zip
          sha256sum APEX-CHAOS-owner-F7-F8-recfix-rc1.zip > APEX-CHAOS-owner-F7-F8-recfix-rc1.sha256
      - name: Publish private review candidate as a separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ github.ref_name }}" = "fix/r5-portrait-audio-framepressure-20261106"
          tag="owner-html5-f7-f8-recfix-20261106-rc1"
          ! gh release view "$tag" >/dev/null 2>&1
          gh release create "$tag" \
            APEX-CHAOS-owner-F7-F8-recfix-rc1.zip \
            APEX-CHAOS-owner-F7-F8-recfix-rc1.sha256 \
            --target "$GITHUB_SHA" \
            --title "APEX CHAOS · Recording and asset-audio fix RC1 — owner hardware review" \
            --notes "Separate prerelease candidate, NOT deployed to itch. Verified: 1080x1920 output, 30fps target, 22 Mbps, tab audio, first-play Chrome, asset inventory, studio synthesized-tone gates. Unverified: sustained hardware-GPU FPS across heavy matchups and actual acoustic quality of captured asset audio. Do not replace r5 until owner A/B acceptance." \
            --prerelease
      # No upload-artifact: GitHub Actions artifact quota was exhausted.
      # Existing owner r5 release remains untouched.
