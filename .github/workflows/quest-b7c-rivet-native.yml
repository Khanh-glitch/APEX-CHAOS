name: B7c Real Fighter RIVET Nonlethal Thresholds
on:
  push:
    branches: ['quest/b7c-native-rivet-damage-from-b6k']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rivet-native:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: pnpm arsenal:sfx:materialize
      - name: Realized damage threshold pure policy
        run: node tools/testQuestRivetThresholdB7a.mjs
      - name: Actual native Fighter 1000→400→375→180, terminal protection
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-rivet-native
      - name: E07 isolated actual 1v1 Arsenal bullet threshold battle
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-rivet-encounter-native
      - name: Regression of E06 three-wave physical battle and retreat
        run: node tools/testArsenalBattleHeadless.mjs --product-authentic --quest-breach-native
      - name: Canonical Gold provenance
        run: node tools/buildGoldCutover.mjs --check
      - name: Production build
        run: pnpm build
