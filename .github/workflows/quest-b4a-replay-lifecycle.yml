name: B4a Replay Lifecycle and Save Isolation
on:
  push:
    branches: ['quest/b4a-replay-lifecycle-from-b4']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - name: Replay lifecycle may not leak signed outcomes to actual save
        run: node tools/testQuestReplayHubB4.mjs
      - name: True native story authorization and Stormbreaker contract
        run: |
          node tools/testQuestDirectorQ1.mjs
          node tools/testQuestStormbreakerFloorB2c.mjs
      - name: Responsive source and arena remain reproducible
        run: |
          node tools/buildGoldCutover.mjs --check
          node tools/testQuestHudArenaB3.mjs
      - run: pnpm install --frozen-lockfile
      - name: Production build
        run: pnpm build
      - name: Start real Gold Vite server
        shell: bash
        run: |
          pnpm dev:lan > /tmp/b4a-vite.log 2>&1 &
          for i in $(seq 1 75); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/b4a-vite.log
          exit 1
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"
      - name: Physical desktop Gold stage replay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_EVIDENCE_DIR: /tmp/b4a-replay
        run: node tools/testQuestStageHubBrowserB4.mjs
      - name: Physical mobile touch Gold stage replay
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          APEX_EVIDENCE_DIR: /tmp/b4a-replay
        run: node tools/testQuestStageHubBrowserB4.mjs --mobile
      - name: Capture Gold replay screenshots and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b4a-gold-replay-desktop-mobile-evidence
          path: |
            /tmp/b4a-replay/
            /tmp/b4a-vite.log
          if-no-files-found: warn
