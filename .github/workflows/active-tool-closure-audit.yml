name: Active Tool Dependency Audit
on:
  push:
    branches: [maintenance/hard-source-prune-20261117]
    paths: ['tools/maintenance/activeToolClosure.mjs', '.github/workflows/active-tool-closure-audit.yml']
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Analyze active tool dependencies
        run: node tools/maintenance/activeToolClosure.mjs
      - name: Pin exact dependency closure on maintenance branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/active-tool-closure.json
          git commit -m 'audit(temporary): record active tool dependency closure'
          git push origin HEAD:maintenance/hard-source-prune-20261117
      - uses: actions/upload-artifact@v4
        with:
          name: active-tool-dependency-audit
          path: reports/active-tool-closure.json
          retention-days: 3
