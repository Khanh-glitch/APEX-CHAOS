name: B6e Physical Fighter Withdrawal Damage Boundary
on:
  push:
    branches: ['quest/b6e-retreat-damage-boundary-from-b6d']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  retreat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9.15.9, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: node tools/testQuestBreachPolicyQ6.mjs
      - run: node tools/testQuestBreachLifecycleB6d.mjs
      - run: node tools/testQuestBreachRetreatB6e.mjs
      - run: node tools/buildGoldCutover.mjs --check
      - run: pnpm build
