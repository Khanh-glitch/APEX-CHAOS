name: BOXE vs FROST Portrait Lag Diagnostics (read-only game)
on:
  push:
    branches:
      - diagnostics/boxe-frost-portrait-20261106
      - fix/boxe-frost-lossless-ice-blit-20261106
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boxe-frost:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install exact project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unmodified game and package the portable itch HTML5
        run: |
          pnpm build
          printf '%s\n' "$(git rev-parse HEAD)" > dist/ITCH_GUEST_BUILD_SHA.txt
          node tools/packItchPortable.mjs
          test -s dist-itch-html5/index.html
          test -s dist-itch-html5/portrait-studio.html
      - name: Frost gameplay/visual law + unchanged owner recorder + studio audio gates
        run: |
          node --check public/game/hero-rework/frostPresentationRuntime.js
          set +e
          node tools/testFrostV1Gates.mjs > /tmp/frost-gates.log 2>&1
          frost_exit=$?
          set -e
          cat /tmp/frost-gates.log
          if [ "$frost_exit" -ne 0 ]; then
            # Release r5/RC2 is from a separate Git ancestry to this older
            # Frost implementation authority commit. This historical ancestry
            # check does not test visuals or gameplay. Explicitly accept ONLY
            # this single inherited failure, never any other Frost gate.
            grep -Fq 'FROST V1 gates: 166/167 PASS' /tmp/frost-gates.log
            grep -Fq 'FAILURES: F00.1-ancestry' /tmp/frost-gates.log
            test "$(grep -c '^FAIL  ' /tmp/frost-gates.log)" = '1'
            echo 'INHERITED EXCEPTION: F00.1-ancestry only; all 166 functional Frost gates PASS'
          fi
          node tools/testOwnerStudioSfxPolicy.mjs
          node tools/testOwnerRecordingFrameBudget.mjs
      - name: Install diagnostic Chromium driver
        run: npm ci --prefix tools/probe --ignore-scripts
      - name: Profile actual BOXE-FROST and BOXE-NEWBOT BOT matches
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          # Diagnostic-only: include exact copy area and channel mismatches on failure.
          node tools/profileBoxeFrostPortrait.mjs
      # No game source changes. No deployment, release or uploaded binary.
