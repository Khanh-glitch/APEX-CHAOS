<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>APEX CHAOS — HUD GOLD</title>
<style>
/* =====================================================================
   APEX CHAOS — GOLD HUD
   CSS ORDER (one system):
   0. TOKENS / PAGE / STAGE
   1. BASE COMPONENT RULES   (rail, timer, arena, side, skill, weapon, fx)
   2. DESKTOP COMPOSITION    #hud[data-layout="desk"]
   3. MOBILE LANDSCAPE       #hud[data-layout="land"]
   4. MOBILE PORTRAIT        #hud[data-layout="port"]
   5. 1P / 2P MODE MODIFIERS #hud[data-mode="1p"]
   6. LAB / DIAGNOSTICS / REDUCED MOTION
   Geometry law: #stage is a size container. Every layout defines
   --arena, --cl, --cr from the stage (cqw/cqh). Body columns AND the
   versus rail columns are derived from the same variables, so the
   timer is always on the arena axis.
   ===================================================================== */

/* ---------- 0. TOKENS / PAGE / STAGE ---------- */
:root{
  --ink:#050607;--g1:#0e1114;--g2:#151a1e;--g3:#1d2329;--line:#262d34;
  --bone:#ece6d6;--bone2:#bdb7a8;--mute:#7f858c;--mute2:#4d535a;
  --p1:#b2ff3a;--p1m:#86cc22;--p1a:rgba(178,255,58,.16);--p1b:rgba(178,255,58,.42);
  --p2:#86dcff;--p2m:#4fb0e2;--p2a:rgba(134,220,255,.16);--p2b:rgba(134,220,255,.42);
  --dmg:#ff3a3a;--crit:#ff8a1e;--heal:#38f27c;
  --fd:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --ol:2px 0 0 #0b0202,-2px 0 0 #0b0202,0 2px 0 #0b0202,0 -2px 0 #0b0202,1.5px 1.5px 0 #0b0202,-1.5px 1.5px 0 #0b0202,1.5px -1.5px 0 #0b0202,-1.5px -1.5px 0 #0b0202,0 4px 0 rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020304;color:var(--bone);font-family:var(--fd);font-stretch:semi-condensed;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none;text-align:inherit}
kbd{font:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}

#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;container-type:size;overflow:hidden;background:#050607;isolation:isolate;
  --safeT:0px;--safeR:0px;--safeB:0px;--safeL:0px}

/* ---------- 1. BASE COMPONENT RULES ---------- */
#hud{position:absolute;inset:0;display:grid;min-width:0;min-height:0;
  --pad:8px;--g:8px;--gx:8px;
  --pT:max(var(--pad),var(--safeT));--pR:max(var(--pad),var(--safeR));--pB:max(var(--pad),var(--safeB));--pL:max(var(--pad),var(--safeL));
  --availW:calc(100cqw - var(--pL) - var(--pR));
  --availH:calc(100cqh - var(--pT) - var(--pB));
  padding:var(--pT) var(--pR) var(--pB) var(--pL);
  row-gap:var(--g);
  background:var(--terr,none),repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 1px,transparent 1px 7px),linear-gradient(180deg,#07080a,#040506);
}

/* --- Versus rail (full HUD width, its own row) --- */
#versusRail{grid-area:rail;position:relative;display:grid;min-width:0;z-index:3;
  grid-template-columns:calc(var(--cl) + var(--gx)) calc(var(--arena) / 2) calc(var(--arena) / 2) calc(var(--cr) + var(--gx));
  grid-template-rows:100%}
#p1Rail{grid-column:1 / 3;grid-row:1;padding-right:calc(var(--mcW) / 2 + 4px);--acc:var(--p1);--fill0:#2c4f05;--fill1:#8bd21d;--fill2:#d6ff70}
#p2Rail{grid-column:3 / 5;grid-row:1;padding-left:calc(var(--mcW) / 2 + 4px);--acc:var(--p2);--fill0:#0b3a5c;--fill1:#4cb2e6;--fill2:#c4f0ff;direction:rtl}
.vrail{position:relative;display:grid;min-width:0;align-content:center;row-gap:2px;
  grid-template-columns:minmax(0,1fr) auto;
  grid-template-rows:var(--lblH) var(--barH) var(--accH);
  grid-template-areas:"lbl hp" "bar bar" "acc acc"}
.vr-lbl{grid-area:lbl;display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;white-space:nowrap;padding-inline-start:calc(var(--st1) + 3px)}
.vr-tag{font-size:10px;font-weight:800;color:#060706;background:var(--acc);padding:2px 7px 1px 5px;letter-spacing:.08em;line-height:1.1;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#p2Rail .vr-tag{padding:2px 5px 1px 7px;clip-path:polygon(0 0,100% 0,100% 100%,4px 100%)}
.vr-name{font-size:var(--nmF);font-weight:700;letter-spacing:.18em;color:var(--bone);line-height:1}
.vr-sub{font-size:9.5px;letter-spacing:.26em;color:var(--mute);line-height:1}
.vr-hp{grid-area:hp;display:flex;align-items:baseline;align-self:end;gap:2px;line-height:.78;padding-inline-end:6px}
#p2Rail .vr-hp{padding:0 0 0 6px}
.vr-cur{font-size:var(--hpF);font-weight:700;font-variant-numeric:tabular-nums;color:var(--bone);letter-spacing:.01em}
.vr-max{font-size:var(--hpmF);color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.vrail.low .vr-cur{color:#ff6a58}
.vr-bar{grid-area:bar;position:relative;min-width:0}
/* three-piece geometry: fixed tail | stretch body | fixed taper (never scaled) */
.vr-shape{position:absolute;inset:0;display:flex;direction:ltr}
#p2Rail .vr-shape{transform:scaleX(-1)}
.vr-piece{display:block;height:100%;background:linear-gradient(180deg,#252c33 0,#252c33 1px,#0f1215 1px,#08090b 100%)}
.vr-tail{flex:0 0 var(--tail);clip-path:polygon(0 0,100% 0,100% 100%,var(--st1) 100%,var(--st1) 64%,var(--st2) 64%)}
.vr-body{flex:1 1 auto;min-width:0}
.vr-taper{flex:0 0 var(--taper);clip-path:polygon(0 0,100% 0,0 100%)}
.vr-clip{position:absolute;inset:0;overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - var(--taper)) 100%,var(--st1) 100%,var(--st1) 64%,var(--st2) 64%)}
.vr-clip>i{position:absolute;inset:0;display:block}
.vr-ghost,.vr-fill{transform-origin:0 50%;will-change:transform}
.vr-ghost{background:linear-gradient(90deg,#5c0a0a,#e52a2a 85%,#ffc9b8)}
.vr-fill{background:linear-gradient(180deg,rgba(255,255,255,.4) 0,rgba(255,255,255,.4) 2px,rgba(255,255,255,0) 2px,rgba(255,255,255,0) 55%,rgba(0,0,0,.25) 100%),linear-gradient(90deg,var(--fill0),var(--fill1) 58%,var(--fill2) 93%,#fff 100%)}
.vr-heal{background:var(--heal);opacity:0}
.vr-low{background:linear-gradient(90deg,rgba(255,40,40,.55),transparent 40%);opacity:0}
.vrail.low .vr-low{animation:lowPulse .9s ease-in-out infinite alternate}
@keyframes lowPulse{from{opacity:0}to{opacity:1}}
.vr-ticks{background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(0,0,0,.6) calc(10% - 2px) 10%)}
.vr-clip>.vr-surge{right:auto;width:16%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95) 62%,transparent);opacity:0}
.vr-acc{grid-area:acc;position:relative;direction:ltr}
.vr-acc::before{content:"";position:absolute;top:0;height:2px;left:var(--tail);right:var(--taper);background:linear-gradient(90deg,var(--acc),transparent 80%);opacity:.6}
#p2Rail .vr-acc::before{left:var(--taper);right:var(--tail);background:linear-gradient(270deg,var(--acc),transparent 80%)}

/* --- Match center / timer --- */
#matchCenter{grid-column:2 / 4;grid-row:1;justify-self:center;position:relative;width:var(--mcW);height:100%;z-index:2;cursor:pointer}
.mc-plate{position:absolute;left:0;right:0;top:0;height:calc(100% + var(--notch));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-bottom:var(--notch);
  background:linear-gradient(180deg,#181d22,#0a0c0f);
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) calc(100% - var(--notch)),calc(50% + 8px) calc(100% - var(--notch)),50% 100%,calc(50% - 8px) calc(100% - var(--notch)),10px calc(100% - var(--notch)))}
.mc-plate::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--p1) 0 50%,var(--p2) 50% 100%)}
.mc-round{display:flex;align-items:center;gap:4px;font-size:var(--mcRF);letter-spacing:.22em;color:var(--mute);line-height:1}
#hud[data-round-authority="0"] .mc-round{display:none}
.mc-round b{font-weight:700;padding:0 2px}
.mc-pip{width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--mute2);display:block}
.mc-pip.on.a{background:var(--p1);border-color:var(--p1)}
.mc-pip.on.b{background:var(--p2);border-color:var(--p2)}
.mc-time{font-size:var(--mcTF);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:.9;color:var(--bone)}
.mc-time.urgent{color:var(--crit)}
.mc-dual{display:none}

/* --- Combat body --- */
#combatBody{grid-area:body;display:grid;min-width:0;min-height:0;
  grid-template-columns:var(--cl) var(--arena) var(--cr);
  grid-template-areas:"p1 arena p2";column-gap:var(--gx)}
#p1Side{grid-area:p1}
#p2Side{grid-area:p2}
#arenaZone{grid-area:arena;position:relative;display:grid;place-items:start center;min-width:0;min-height:0}
#arena{position:relative;width:var(--arena);height:var(--arena);background:#0a0d10;box-shadow:0 0 0 1px #000,0 20px 60px rgba(0,0,0,.6)}
#arenaCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.af{position:absolute;inset:0;pointer-events:none;border:1px solid #252c33}
.af .c{position:absolute;width:20px;height:20px;border:2px solid var(--cc);display:block}
.af .tl{left:-4px;top:-4px;border-right:0;border-bottom:0;--cc:var(--p1)}
.af .bl{left:-4px;bottom:-4px;border-right:0;border-top:0;--cc:var(--p1)}
.af .tr{right:-4px;top:-4px;border-left:0;border-bottom:0;--cc:var(--p2)}
.af .br{right:-4px;bottom:-4px;border-left:0;border-top:0;--cc:var(--p2)}
.af .axis{position:absolute;left:50%;top:0;width:2px;height:7px;margin-left:-1px;background:var(--bone);opacity:.45;display:block}
.shock{position:absolute;display:block;opacity:0;background:var(--bone)}
.shock.l{left:-3px;top:0;bottom:0;width:5px}
.shock.r{right:-3px;top:0;bottom:0;width:5px}
.shock.t{top:-3px;left:0;right:0;height:5px}
.shock.b{bottom:-3px;left:0;right:0;height:5px}
#arenaFx{position:absolute;inset:0;pointer-events:none}

/* damage semantics: red normal / orange crit (+diamond) / green heal */
.dmg{position:absolute;left:0;top:0;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;text-shadow:var(--ol);pointer-events:none;will-change:transform,opacity}
.dmg.n{color:var(--dmg);font-size:max(13px,calc(var(--arena) * .03))}
.dmg.c{color:var(--crit);font-size:max(18px,calc(var(--arena) * .046));font-style:italic}
.dmg.h{color:var(--dmg);font-size:max(22px,calc(var(--arena) * .062));font-style:italic}
.dmg.heal{color:var(--heal);font-size:max(14px,calc(var(--arena) * .034))}
.dmg.c::before,.bignum.c::before{content:"";display:inline-block;width:.38em;height:.38em;background:var(--crit);transform:translateY(-.12em) rotate(45deg);margin-right:.26em;box-shadow:0 0 0 2px #1a0900}
.dmg.h::after,.bignum.h::after{content:"";display:block;height:.12em;margin-top:.06em;background:var(--dmg);clip-path:polygon(0 0,30% 100%,45% 0,70% 100%,82% 0,100% 100%,0 100%);box-shadow:none}

/* --- Side territory --- */
.side{position:relative;display:grid;min-width:0;min-height:0;
  --acc:var(--p1);--accM:var(--p1m);--accA:var(--p1a);--accB:var(--p1b)}
.side[data-p="2"]{--acc:var(--p2);--accM:var(--p2m);--accA:var(--p2a);--accB:var(--p2b)}
.side[data-mirror]{direction:rtl}
.side>*{min-width:0}
.side-art{position:absolute;display:none;pointer-events:none;color:var(--acc);opacity:.07}
.side-art svg{width:100%;height:100%;display:block}
.edge{position:absolute;display:block;pointer-events:none;background:linear-gradient(180deg,transparent,var(--accB) 18%,var(--accB) 82%,transparent);opacity:.55;width:1px;top:4%;bottom:4%;inset-inline-end:calc(var(--gx) / -2)}

.ident{grid-area:id;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"por txt";align-items:center;column-gap:var(--idGap,12px);min-width:0}
.portrait{grid-area:por;position:relative;width:var(--porW);height:var(--porH);color:var(--acc);background:#0b0e10;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.side[data-mirror] .portrait{clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
.portrait svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.portrait::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--acc)}
.id-status{position:absolute;left:0;right:0;bottom:3px;font-size:8.5px;font-weight:800;letter-spacing:.14em;text-align:center;color:#060706;background:var(--crit);opacity:0;line-height:1.5;direction:ltr}
.id-status.low{color:#fff;background:var(--dmg)}
.rival-health,.duel-feed{display:none}
.rival-health{color:var(--racc,var(--bone));min-width:0}
.rival-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:baseline;gap:4px;min-width:0}
.rival-tag{font-size:7.5px;font-weight:800;letter-spacing:.1em;color:var(--mute)}
.rival-name{font-size:8.5px;font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--racc,var(--bone))}
.rival-hp{font-size:12px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--bone);line-height:1}
.rival-bar{position:relative;height:5px;margin-top:2px;background:#090b0d;border:1px solid #293037;overflow:hidden;clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.rival-fill{position:absolute;inset:0;background:linear-gradient(90deg,var(--racc,var(--bone)),color-mix(in srgb,var(--racc,var(--bone)) 55%,#fff));transform-origin:0 50%;will-change:transform}
.rival-health.low .rival-hp{color:#ff6a58}
.rival-health.low .rival-fill{background:linear-gradient(90deg,#9f1117,#ff4b43)}
.duel-feed{min-width:0;height:22px;align-items:center;justify-content:flex-start;gap:5px;padding:2px 5px;border-left:2px solid var(--feed,var(--mute2));background:linear-gradient(90deg,color-mix(in srgb,var(--feed,var(--mute2)) 12%,transparent),transparent 86%);overflow:hidden;white-space:nowrap}
.duel-feed .df-role{font-size:7.5px;font-weight:800;letter-spacing:.11em;color:var(--mute)}
.duel-feed .df-tier{font-size:8px;font-weight:900;letter-spacing:.08em;color:var(--feed,var(--bone2))}
.duel-feed .df-value{font-size:14px;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums;color:var(--feed,var(--bone));text-shadow:var(--ol);line-height:1}
.duel-feed.pulse{display:flex}

.id-txt{grid-area:txt;display:grid;gap:3px;min-width:0}
.id-row{display:flex;align-items:center;gap:6px;min-width:0}
.id-tag{font-size:10px;font-weight:800;color:#060706;background:var(--acc);padding:1px 6px;letter-spacing:.1em;line-height:1.3}
.id-ctrl{font-size:9.5px;letter-spacing:.2em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-name{font-size:var(--nameF);font-weight:800;letter-spacing:.08em;line-height:.92;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.id-sub{font-size:10.5px;letter-spacing:.26em;color:var(--accM);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* skills: strongest object in side territory */
.skills{grid-area:sk;display:grid;gap:var(--skGap,8px);min-width:0;min-height:0}
.skill{position:relative;display:grid;min-width:0;min-height:0;overflow:hidden;color:var(--bone);
  grid-template-columns:var(--artW) minmax(0,1fr);grid-template-areas:"art info";
  background:linear-gradient(90deg,#161b20,#0d1013);
  --chamf:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));clip-path:var(--chamf)}
.side[data-mirror] .skill{--chamf:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.skill::before{content:"";position:absolute;z-index:6;top:0;bottom:0;inset-inline-end:0;width:3px;background:var(--acc);transition:opacity .2s}
.skill::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.06);pointer-events:none}
.sk-art{grid-area:art;position:relative;display:grid;place-items:center;overflow:hidden;color:var(--acc);
  background:radial-gradient(68% 68% at 50% 56%,var(--accA),transparent 72%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 6px),linear-gradient(135deg,#1c2228,#0b0e11)}
.sk-art svg{position:relative;z-index:1;width:60%;height:60%;display:block;transition:opacity .2s}
.sk-mask{position:absolute;inset:0;z-index:2;background:rgba(5,6,7,.8);transform-origin:50% 0;transform:scaleY(0)}
.sk-cdn{position:absolute;inset:0;z-index:3;display:grid;place-items:center;font-size:var(--cdF,22px);font-weight:800;font-variant-numeric:tabular-nums;color:var(--bone);opacity:0}
.sk-sweep{position:absolute;z-index:4;top:-20%;bottom:-20%;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-140%) skewX(-18deg)}
.sk-info{grid-area:info;display:flex;flex-direction:column;justify-content:center;gap:var(--infoGap,5px);padding:var(--infoPad,8px 12px);min-width:0}
.sk-top{display:flex;align-items:center;gap:7px;min-width:0}
.sk-key{min-width:var(--keyS,20px);height:var(--keyS,20px);padding:0 4px;display:inline-grid;place-items:center;font-size:var(--keyF,11px);font-weight:800;color:#060706;background:var(--acc);line-height:1;clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%)}
.sk-slot{font-size:9.5px;letter-spacing:.24em;color:var(--mute);white-space:nowrap}
.sk-name{font-size:var(--skNF,16px);font-weight:800;letter-spacing:.06em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-desc{font-size:11px;color:var(--mute);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-meter{display:flex;align-items:center;gap:7px;min-width:0}
.sk-bar{position:relative;flex:1 1 auto;min-width:16px;height:4px;background:#232a30;overflow:hidden}
.sk-bar i{position:absolute;inset:0;display:block;background:var(--acc);transform-origin:0 50%}
.side[data-mirror] .sk-bar i{transform-origin:100% 50%}
.sk-pips{display:flex;gap:3px}
.sk-pips:empty{display:none}
.sk-pips i{width:7px;height:7px;display:block;transform:skewX(-20deg);background:#2a3138}
.sk-pips i.on{background:var(--acc)}
.sk-state{font-size:var(--stF,10.5px);font-weight:700;letter-spacing:.12em;color:var(--acc);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:3.6em;text-align:end}
.sk-flash{position:absolute;inset:0;z-index:7;pointer-events:none;box-shadow:inset 0 0 0 2px var(--acc);opacity:0}
.skill[data-state="cd"] .sk-name{color:var(--bone2);opacity:.55}
.skill[data-state="cd"] .sk-art svg{opacity:.35}
.skill[data-state="cd"] .sk-cdn{opacity:1}
.skill[data-state="cd"] .sk-state{color:var(--mute)}
.skill[data-state="cd"]::before{opacity:.18}
.skill[data-state="cast"]{background:linear-gradient(90deg,var(--accA),#0d1013)}
.skill:hover::after{border-color:rgba(255,255,255,.14)}

/* weapon / status */
.weapon{grid-area:wp;position:relative;display:grid;min-width:0;align-items:center;
  grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ico txt" "amm swp" "mag mag";
  column-gap:12px;row-gap:7px;padding:10px 12px;
  background:linear-gradient(90deg,rgba(255,255,255,.028),transparent);border-top:1px solid var(--line)}
.side[data-mirror] .weapon{background:linear-gradient(270deg,rgba(255,255,255,.028),transparent)}
.wp-ico{grid-area:ico;display:block;width:var(--wpIW,90px);height:calc(var(--wpIW,90px) * .3);color:var(--bone2)}
.wp-ico svg{width:100%;height:100%;display:block}
.side[data-mirror] .wp-ico svg{transform:scaleX(-1)}
.wp-txt{grid-area:txt;display:grid;gap:2px;min-width:0}
.wp-type{font-size:9.5px;letter-spacing:.26em;color:var(--mute);white-space:nowrap}
.wp-name{font-size:var(--wpNF,14px);font-weight:800;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1}
.wp-amm{grid-area:amm;display:flex;align-items:baseline;gap:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wp-cur{font-size:var(--amF,22px);font-weight:800;line-height:.9}
.wp-max{font-size:11px;color:var(--mute);letter-spacing:.06em}
.weapon.reloading .wp-cur,.weapon.reloading .wp-max{color:var(--crit)}
.wp-swap{grid-area:swp;justify-self:end;display:flex;align-items:center;gap:7px;min-width:var(--swW,0px);height:var(--swH,28px);padding:0 9px;background:#101418;border:1px solid var(--line);color:var(--mute);font-size:10px;letter-spacing:.14em;white-space:nowrap}
.wp-swap kbd{min-width:18px;height:18px;display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;color:#060706;background:var(--bone2);padding:0 3px}
.wp-swap::after{content:"⇄";font-size:13px;color:var(--bone2);letter-spacing:0}
.wp-swap:active{background:#1b2127}
.wp-mag{grid-area:mag;position:relative;display:block;height:3px;background:#1c2126;direction:ltr}
.wp-mag i{position:absolute;inset:0;display:block;background:repeating-linear-gradient(90deg,var(--bone2) 0 calc(var(--seg,10%) - 1.5px),transparent calc(var(--seg,10%) - 1.5px) var(--seg,10%))}
.weapon.reloading .wp-mag i{background:var(--crit)}
.wp-flash{position:absolute;inset:0;background:var(--accA);opacity:0;pointer-events:none}

/* layers */
#copyLayer,#globalFx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#globalFx{z-index:20}
#copyLayer{z-index:30}
#ruptureLayer{position:absolute;inset:0;z-index:18;pointer-events:none;overflow:hidden}
#fxDefs{position:absolute;width:0;height:0;overflow:hidden}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.gfx-flash{position:absolute;inset:0;opacity:0}
.gfx-tension{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(150,10,10,.34) 80%,rgba(55,0,0,.72) 100%)}
#fracture{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#fracture polygon{transform-box:fill-box;transform-origin:center}
.rupture-group{position:absolute;isolation:isolate;pointer-events:none;will-change:opacity}
.rupture-copy{position:absolute;inset:0 auto auto 0;min-width:0;min-height:0;margin:0;pointer-events:none;overflow:hidden}
.rupture-whole{z-index:1;opacity:0;filter:url(#panelWarp) saturate(1.16) contrast(1.08);mix-blend-mode:screen}
.rupture-spectrum{z-index:2;opacity:0;mix-blend-mode:screen;filter:saturate(5) hue-rotate(145deg) brightness(1.35)}
.rupture-spectrum.red{filter:saturate(7) hue-rotate(300deg) brightness(1.3)}
.rupture-piece{position:absolute;inset:0;z-index:3;overflow:hidden;pointer-events:none;will-change:transform,opacity;filter:saturate(1.08) contrast(1.06)}
.rupture-piece::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.25),transparent 24%,transparent 72%,rgba(0,0,0,.25));mix-blend-mode:screen}
.rupture-lens{position:absolute;z-index:5;display:block;border:1px solid rgba(235,251,255,.8);border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.44),rgba(132,219,255,.12) 38%,transparent 74%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.08),0 0 14px rgba(125,211,255,.16);mix-blend-mode:screen;will-change:transform,opacity}
.side-light{position:absolute;inset:0;z-index:8;display:block;pointer-events:none;opacity:0;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 50%,rgba(205,246,255,.36),rgba(105,205,255,.09) 54%,transparent 78%)}
.side[data-p="1"] .side-light{background:radial-gradient(ellipse at 50% 50%,rgba(228,255,170,.3),rgba(178,255,58,.08) 54%,transparent 78%)}
.sweep-track{position:absolute;left:0;top:0;height:0;transform-origin:0 0}
.streak{position:absolute;left:0;top:calc(var(--th) / -2);height:var(--th);display:block;
  background:linear-gradient(90deg,transparent 0%,var(--sca) 42%,var(--sc) 84%,#fff 96%,transparent 100%);
  clip-path:polygon(0 47%,88% 6%,100% 50%,88% 94%,0 53%)}
.cutline{position:absolute;left:0;top:-1px;height:2px;width:100%;display:block;background:linear-gradient(90deg,transparent,#fff 15%,#fff 85%,transparent);transform-origin:0 50%}
.cstreak{position:absolute;left:0;top:-1px;height:2px;display:block;transform-origin:0 50%;background:linear-gradient(90deg,transparent,var(--sc) 65%,#fff)}
.stamp{position:absolute;left:0;top:0;font-weight:900;font-style:italic;line-height:.9;letter-spacing:.04em;white-space:nowrap;padding:.1em .34em .04em;will-change:transform,opacity}
.stamp.crit{color:#170800;background:var(--crit);clip-path:polygon(5% 0,100% 0,95% 100%,0 100%)}
.stamp.heavy{color:var(--bone);background:linear-gradient(90deg,#c8161a,#6d0709);clip-path:polygon(4% 0,100% 0,96% 100%,0 100%)}
.stamp.ko{color:var(--bone);background:none;text-shadow:5px 5px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;letter-spacing:.06em}
.bignum{position:absolute;left:0;top:0;font-weight:800;font-style:italic;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;text-shadow:var(--ol);will-change:transform,opacity}
.bignum.c{color:var(--crit)}
.bignum.h{color:var(--dmg)}
.facing-p2{rotate:180deg}
.chroma-line{position:absolute;left:0;top:-2px;height:4px;display:block;transform-origin:0 50%;opacity:0;mix-blend-mode:screen}
.chroma-line.cyan{background:linear-gradient(90deg,transparent,rgba(116,233,255,.9) 52%,transparent)}
.chroma-line.red{background:linear-gradient(90deg,transparent,rgba(255,62,64,.85) 52%,transparent)}
.round-call{position:absolute;left:50%;top:50%;font-size:15px;font-weight:800;letter-spacing:.3em;color:var(--bone);padding:5px 12px;border-block:1px solid rgba(236,230,214,.35);background:rgba(4,5,6,.82);white-space:nowrap;transform:translate(-50%,-50%);will-change:transform,opacity}

/* ---------- 2. DESKTOP COMPOSITION ---------- */
#hud[data-layout="desk"]{
  --pad:8px;--g:8px;--gx:8px;--railH:48px;--mcW:108px;--notch:7px;
  --lblH:18px;--barH:20px;--accH:4px;--nmF:14px;--hpF:25px;--hpmF:11px;--mcTF:25px;--mcRF:8.5px;
  --tail:30px;--st1:18px;--st2:9px;--taper:34px;
  --sideMin:280px;
  --arena:min(calc(var(--availW) - 2 * var(--sideMin) - 2 * var(--gx)),calc(var(--availH) - var(--railH) - var(--g)));
  --cl:calc((var(--availW) - var(--arena) - 2 * var(--gx)) / 2);--cr:var(--cl);
  grid-template-rows:var(--railH) minmax(0,1fr);grid-template-areas:"rail" "body";
  --terr:radial-gradient(40% 70% at 0% 58%,rgba(178,255,58,.06),transparent 72%),radial-gradient(40% 70% at 100% 58%,rgba(134,220,255,.06),transparent 72%);
}
#hud[data-layout="desk"] .side{grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"id" "sk" "wp";row-gap:14px;padding-top:8px;
  --porW:clamp(76px,10.4cqh,118px);--porH:calc(var(--porW) * 1.2);--idGap:14px;--nameF:clamp(24px,3.2cqh,36px);
  --tileH:clamp(106px,14cqh,160px);--artW:var(--tileH);--skGap:10px;--infoGap:7px;--infoPad:10px 16px 10px 14px;
  --keyS:22px;--keyF:12px;--skNF:clamp(16px,2.1cqh,21px);--stF:11px;--cdF:clamp(20px,3cqh,30px);
  --wpIW:clamp(92px,11cqh,124px);--wpNF:15px;--amF:24px;--swH:30px}
#hud[data-layout="desk"] .side>.ident,
#hud[data-layout="desk"] .side>.skills,
#hud[data-layout="desk"] .side>.weapon{width:min(100%,384px);justify-self:end}
#hud[data-layout="desk"] .skills{align-self:center;grid-auto-rows:var(--tileH)}
#hud[data-layout="desk"] .side-art{display:block;top:16%;bottom:22%;width:min(78%,300px);inset-inline-start:0}

/* ---------- 3. MOBILE LANDSCAPE COMPOSITION ---------- */
#hud[data-layout="land"]{
  --pad:6px;--g:6px;--gx:6px;--railH:34px;--mcW:78px;--notch:5px;
  --lblH:12px;--barH:13px;--accH:3px;--nmF:10.5px;--hpF:16px;--hpmF:9px;--mcTF:17px;--mcRF:7px;
  --tail:18px;--st1:11px;--st2:5px;--taper:20px;
  --sideMin:150px;
  --arena:min(calc(var(--availW) - 2 * var(--sideMin) - 2 * var(--gx)),calc(var(--availH) - var(--railH) - var(--g)));
  --cl:calc((var(--availW) - var(--arena) - 2 * var(--gx)) / 2);--cr:var(--cl);
  grid-template-rows:var(--railH) minmax(0,1fr);grid-template-areas:"rail" "body";
  --terr:radial-gradient(40% 70% at 0% 58%,rgba(178,255,58,.06),transparent 72%),radial-gradient(40% 70% at 100% 58%,rgba(134,220,255,.06),transparent 72%);
}
#hud[data-layout="land"] .vr-sub,
#hud[data-layout="port"] .vr-sub{display:none}
#hud[data-layout="land"] .side{grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"id" "sk" "wp";row-gap:6px;
  --porW:34px;--porH:34px;--idGap:8px;--nameF:15px;
  --artW:min(44%,110px);--skGap:6px;--infoPad:6px 9px;--infoGap:5px;--keyS:18px;--keyF:10.5px;--skNF:12.5px;--stF:9.5px;--cdF:20px;
  --wpIW:44px;--wpNF:11px;--amF:15px;--swH:42px;--swW:46px}
#hud[data-layout="land"] .skills{grid-template-rows:1fr 1fr}
#hud[data-layout="land"] .sk-desc,
#hud[data-layout="land"] .sk-slot,
#hud[data-layout="land"] .id-sub{display:none}
#hud[data-layout="land"] .portrait,
#hud[data-layout="port"] .portrait{clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
#hud[data-layout="land"] .side[data-mirror] .portrait,
#hud[data-layout="port"] .side[data-mirror] .portrait{clip-path:polygon(0 0,100% 0,100% 100%,8px 100%,0 calc(100% - 8px))}
#hud[data-layout="land"] .weapon{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico amm swp" "txt txt swp" "mag mag swp";column-gap:7px;row-gap:3px;padding:3px 0 2px;padding-inline-start:4px}
#hud[data-layout="land"] .wp-type,
#hud[data-layout="land"] .wp-alt{display:none}
#hud[data-layout="land"] .wp-swap{justify-content:center;padding:0 5px;gap:4px}

/* ---------- 4. MOBILE PORTRAIT COMPOSITION ---------- */
#hud[data-layout="port"]{
  --pad:6px;--g:6px;--gx:0px;--railH:38px;--mcW:74px;--notch:5px;
  --lblH:14px;--barH:14px;--accH:3px;--nmF:11px;--hpF:18px;--hpmF:9px;--mcTF:19px;--mcRF:7px;
  --tail:16px;--st1:10px;--st2:5px;--taper:18px;
  --zoneMin:132px;
  --arena:min(var(--availW),calc(var(--availH) - var(--railH) - 2 * var(--zoneMin) - 3 * var(--g)));
  --cl:calc((var(--availW) - var(--arena)) / 2);--cr:var(--cl);
  --zoneH:calc((var(--availH) - var(--railH) - var(--arena) - 3 * var(--g)) / 2);
  grid-template-rows:var(--zoneH) var(--railH) var(--arena) var(--zoneH);
  grid-template-areas:"p2" "rail" "arena" "p1";
  --terr:radial-gradient(80% 24% at 50% 100%,rgba(178,255,58,.07),transparent 75%),radial-gradient(80% 24% at 50% 0%,rgba(134,220,255,.07),transparent 75%);
}
#hud[data-layout="port"] #combatBody{display:contents}
#hud[data-layout="port"] .af .tl,#hud[data-layout="port"] .af .tr{--cc:var(--p2)}
#hud[data-layout="port"] .af .bl,#hud[data-layout="port"] .af .br{--cc:var(--p1)}
#hud[data-layout="port"] .edge{top:calc(var(--g) / -2);bottom:auto;left:8%;right:8%;width:auto;height:1px;background:linear-gradient(90deg,transparent,var(--accB) 20%,var(--accB) 80%,transparent)}
/* shared-device: P2 controls face the opposite edge; arena + rail never rotate */
#hud[data-layout="port"][data-mode="2p"] #p2Side{rotate:180deg}
#hud[data-layout="port"] .side{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"id sk" "wp sk";column-gap:6px;row-gap:6px;
  --porW:38px;--porH:38px;--idGap:8px;--nameF:16px;
  --tw:min(122px,calc((100cqw - 24px) * .31));--skGap:6px;--keyS:18px;--keyF:10.5px;--skNF:11.5px;--stF:9.5px;--cdF:22px;
  --wpIW:42px;--wpNF:10.5px;--amF:15px;--swH:44px;--swW:44px}
#hud[data-layout="port"] .id-sub{display:none}
#hud[data-layout="port"] .skills{grid-template-columns:var(--tw) var(--tw)}
#hud[data-layout="port"] .skill{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"art" "info";text-align:center}
#hud[data-layout="port"] .skill::before{inset:0 0 auto 0;width:auto;height:3px}
#hud[data-layout="port"] .sk-top{position:absolute;top:6px;inset-inline-start:6px;z-index:6}
#hud[data-layout="port"] .sk-slot,
#hud[data-layout="port"] .sk-desc{display:none}
#hud[data-layout="port"] .sk-info{padding:5px 7px 7px;gap:5px;justify-content:flex-start}
#hud[data-layout="port"] .sk-state{min-width:0}
#hud[data-layout="port"] .weapon{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico amm swp" "txt txt swp" "mag mag swp";column-gap:6px;row-gap:3px;padding:4px 0 2px;border-top:1px solid var(--line)}
#hud[data-layout="port"] .wp-type,
#hud[data-layout="port"] .wp-alt{display:none}
#hud[data-layout="port"] .wp-swap{justify-content:center;padding:0 4px;gap:3px;align-self:stretch;height:auto;min-height:var(--swH)}

/* Portrait shared-device duel: each live HP rail docks in its owner's control territory.
   The center row becomes a dual-facing timer; all values still read S.players/S.timer. */
#hud[data-layout="port"][data-mode="2p"]{--railH:34px;--mcW:112px}
#hud[data-layout="port"][data-mode="2p"] .side{
  grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"id sk" "hp sk" "rival sk" "feed sk" ". sk" "wp sk";
  row-gap:3px}
#hud[data-layout="port"][data-mode="2p"] .rival-health{grid-area:rival;display:block;padding:1px 3px 2px 0}
#hud[data-layout="port"][data-mode="2p"] .duel-feed{grid-area:feed;display:flex;opacity:.36}
#hud[data-layout="port"][data-mode="2p"] .duel-feed.pulse{opacity:1}
#hud[data-layout="port"][data-mode="2p"] #p2Side .rival-bar{clip-path:polygon(4px 0,100% 0,100% 100%,0 100%)}

#hud[data-layout="port"][data-mode="2p"] #p1Rail,
#hud[data-layout="port"][data-mode="2p"] #p2Rail{
  grid-area:hp;grid-column:auto;grid-row:auto;padding:0;direction:ltr;
  --lblH:11px;--barH:8px;--accH:2px;--nmF:9px;--hpF:15px;--hpmF:8px;
  --tail:10px;--st1:6px;--st2:3px;--taper:11px}
#hud[data-layout="port"][data-mode="2p"] .side .vrail{row-gap:1px;grid-template-rows:var(--lblH) var(--barH) var(--accH)}
#hud[data-layout="port"][data-mode="2p"] .side .vr-tag{font-size:8px;padding:1px 4px;letter-spacing:.04em}
#hud[data-layout="port"][data-mode="2p"] .side .vr-name{font-size:9px;letter-spacing:.1em}
#hud[data-layout="port"][data-mode="2p"] .side .vr-hp{padding:0 3px;gap:1px}
#hud[data-layout="port"][data-mode="2p"] #p2Rail .vr-hp{padding:0 3px}
#hud[data-layout="port"][data-mode="2p"] #p2Rail .vr-shape{transform:none}
#hud[data-layout="port"][data-mode="2p"] #p2Rail .vr-acc::before{left:var(--tail);right:var(--taper);background:linear-gradient(90deg,var(--acc),transparent 80%)}
#matchCenter.dual-local{width:112px}
#matchCenter.dual-local .mc-round,
#matchCenter.dual-local>.mc-plate>.mc-time{display:none}
#matchCenter.dual-local .mc-dual{display:grid}
#matchCenter.dual-local .mc-plate{padding:0 0 var(--notch);gap:0}
.mc-dual{position:absolute;inset:2px 3px var(--notch);grid-template-rows:1fr 1fr;align-items:center}
.mc-view{display:flex;align-items:center;justify-content:center;gap:7px;min-height:0;font-size:8px;line-height:1;letter-spacing:.1em;color:var(--bone2);font-variant-numeric:tabular-nums}
.mc-view b{font-weight:700}
.mc-view .mc-view-time{font-size:11px;color:var(--bone);letter-spacing:.03em}
.mc-view-p2{transform:rotate(180deg);border-bottom:1px solid rgba(134,220,255,.18);color:var(--p2)}
.mc-view-p1{border-top:1px solid rgba(178,255,58,.18);color:var(--p1)}
.mc-view-p2 .mc-view-time{color:#ddf6ff}
.mc-view-p1 .mc-view-time{color:#efffd5}

/* ---------- 5. 1P / 2P MODE MODIFIERS ---------- */
/* 1P: enemy is not locally controlled -> abilities become threat readouts */
#hud[data-mode="1p"] #p2Side .skill{pointer-events:none;cursor:default;--artW:var(--thW,56px);background:linear-gradient(270deg,rgba(255,255,255,.035),transparent)}
#hud[data-mode="1p"] #p2Side .sk-key,
#hud[data-mode="1p"] #p2Side .sk-desc,
#hud[data-mode="1p"] #p2Side .wp-swap{display:none}
#hud[data-mode="1p"] #p2Side .skill::before{opacity:.5}
#hud[data-mode="1p"] #p2Side .sk-name{font-size:var(--thNF,13px)}
/* desktop solo */
#hud[data-layout="desk"][data-mode="1p"] #p2Side{--thW:58px;--thNF:14px}
#hud[data-layout="desk"][data-mode="1p"] #p2Side .skills{align-self:start;grid-auto-rows:58px;margin-top:6px}
/* mobile landscape solo: P1 territory widens (thumb), enemy collapses to status column */
#hud[data-layout="land"][data-mode="1p"]{
  --crW:156px;
  --arena:min(calc(var(--availW) - var(--crW) - 200px - 2 * var(--gx)),calc(var(--availH) - var(--railH) - var(--g)));
  --cr:var(--crW);--cl:calc(var(--availW) - var(--arena) - var(--cr) - 2 * var(--gx))}
#hud[data-layout="land"][data-mode="1p"] #p1Side{--artW:min(46%,118px);--skNF:14px}
#hud[data-layout="land"][data-mode="1p"] #p2Side{grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"id" "sk" "." "wp";--thW:36px;--thNF:11px}
#hud[data-layout="land"][data-mode="1p"] #p2Side .skills{grid-template-rows:none;grid-auto-rows:40px}
#hud[data-layout="land"][data-mode="1p"] #p2Side .sk-info{padding:3px 7px;gap:4px}
#hud[data-layout="land"][data-mode="1p"] #p2Side .sk-art svg{width:68%;height:68%}
#hud[data-layout="land"][data-mode="1p"] #p2Side .weapon{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"ico txt amm" "mag mag mag";padding:5px 6px 3px 0}
/* mobile portrait solo: enemy strip / arena / big thumb zone */
#hud[data-layout="port"][data-mode="1p"]{
  --stripH:48px;--p1Min:200px;
  --arena:min(var(--availW),calc(var(--availH) - var(--stripH) - var(--railH) - var(--p1Min) - 3 * var(--g)));
  grid-template-rows:var(--stripH) var(--railH) var(--arena) minmax(0,1fr)}
#hud[data-layout="port"][data-mode="1p"] #p1Side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"id wp" "sk sk";row-gap:8px;padding-bottom:2px;
  --porW:44px;--porH:44px;--nameF:18px;--skNF:15px;--stF:10.5px;--cdF:30px;--keyS:20px;--keyF:11.5px}

/* ==========================================================================

   Generated by tools/buildGoldCutover.mjs (patch HUD-H15).
   This seam replaces the removed donor simulator callbacks with production
   truth: every canonical presentation function above (applyDamage/heal/cast/
   ko/renderRail/renderWeapon/renderSkills/renderTimer/applyViewport/...) is
   invoked with real production state/events. No donor demo truth survives.

(function apexGoldHudSeam(){
  'use strict';
  const seamVersion='gold-hud-seam-v1';
  const seam=window.APEX_GOLD_HUD||(window.APEX_GOLD_HUD={});
  if(seam.__installed===seamVersion)return;
  seam.__installed=seamVersion;
  seam.version=seamVersion;

  // Real fighter positions (production arena space, 0..1000) drive the
  // canonical FX anchor points (popups, sweeps, flashes, streaks).
  seam.syncFighters=function syncFighters(pos){
    if(!pos)return;
    for(let i=0;i<2;i++){
      const p=pos[i];if(!p)continue;
      G.f[i].x=clamp(Number(p.x)||0,0,1000);
      G.f[i].y=clamp(Number(p.y)||0,0,1000);
      if(Number.isFinite(p.aim))G.f[i].aim=Number(p.aim);
    }
  };

  seam.setMode=function setMode(mode){
    if(S.mode!==mode){S.mode=mode;applyViewport();}
  };
  seam.setLive=function setLive(live){S.paused=!live;};

  // Owner input law drives the canonical key hints: P1 J=A1/K=A2, Local 2P
  // Digit1/Digit2, BOT mode exposes P1 controls only (P2 is real CPU).
  function applyKeyLabels(i,labels){
    const u=R.side[i]&&R.side[i].skills;if(!u)return;
    for(let k=0;k<2&&k<u.length;k++){
      const el=u[k].el&&u[k].el.querySelector('.sk-key');
      if(el)el.textContent=(labels&&labels[k])||'';
    }
  }

  // Per-frame production projection -> canonical renderers.
  seam.applyState=function applyState(st){
    if(!st)return;
    const now=performance.now();
    if(Number.isFinite(st.timer))S.timer=st.timer;
    // Timer truth: elapsed-time semantics unless production supplies a
    // countdown/round authority (current Arsenal does not).
    S.roundAuthority=st.roundAuthority===true;
    if(S.roundAuthority){
      if(Number.isFinite(st.round))S.round=st.round;
      if(Array.isArray(st.wins))S.wins=[Number(st.wins[0])||0,Number(st.wins[1])||0];
    }
    const hud=document.getElementById('hud');
    if(hud)hud.dataset.roundAuthority=S.roundAuthority?'1':'0';
    if(typeof st.ko==='boolean')S.ko=st.ko;
    for(let i=0;i<2;i++){
      const s=st.sides&&st.sides[i];if(!s)continue;
      const p=S.players[i];
      if(s.accent&&HEROES[i].accent!==s.accent)HEROES[i].accent=s.accent;
      if(Array.isArray(s.keyLabels))applyKeyLabels(i,s.keyLabels);
      if(Number.isFinite(s.hp)){
        const hp=Math.max(0,Number(s.hp));
        if(Math.abs(p.hp-hp)>0.01){
          if(hp<p.hp){p.ghost=Math.max(p.ghost,p.hp);p.hold=now+650;}
          p.hp=hp;renderRail(i);
        }
      }
      if(Number.isFinite(s.maxHp)&&s.maxHp>0&&p.max!==s.maxHp){p.max=s.maxHp;renderRail(i);}
      if(s.weapon){
        if(Number.isFinite(s.weapon.index))p.wi=0;
        const w=HEROES[i].weapons[0];
        if(w){
          if(s.weapon.name)w.name=s.weapon.name;
          if(s.weapon.type)w.type=s.weapon.type;
          if(Number.isFinite(s.weapon.mag)&&s.weapon.mag>0)w.mag=s.weapon.mag;
          if(Number.isFinite(s.weapon.ammo))p.ammo[0]=s.weapon.ammo;
        }
        p.reloadUntil=0;
        renderWeapon(i);
      }
      if(Array.isArray(s.skills)){
        for(let k=0;k<2&&k<s.skills.length;k++){
          const sk=s.skills[k],a=p.abil[k];if(!a||!sk)continue;
          if(sk.name){
            a.name=sk.name;
            const el=R.side[i].skills[k].el.querySelector('.sk-name');
            if(el&&el.textContent!==sk.name)el.textContent=sk.name;
          }
          if(Number.isFinite(sk.cd))a.cd=Math.max(.05,sk.cd);
          if(Number.isFinite(sk.max))a.max=Math.max(1,sk.max);
          if(Number.isFinite(sk.charges))a.charges=Math.max(0,Math.min(a.max,sk.charges));
          // nextIn is the REAL remaining time from production; the donor
          // only re-derives its own absolute deadline from it.
          a.next=Number.isFinite(sk.nextIn)&&sk.nextIn>0?now+sk.nextIn*1000:0;
          a.__truth=!!sk.truth;
          if(sk.castUntil)a.castUntil=now+380;
        }
      }
    }
  };

  // Discrete production events -> canonical presentation (real values).
  seam.hit=function hit(a,v,amt,tier,afterHp){
    const p=S.players[v];if(!p)return;
    if(Number.isFinite(afterHp)){p.hp=Math.max(0,afterHp+Math.round(amt));}
    applyDamage(a,v,Math.round(amt),tier);
  };
  // Confirmed Stormbreaker damaging hit = Heavy family + Thunder family.
  seam.hitStorm=function hitStorm(a,v,amt,afterHp){
    const p=S.players[v];if(!p)return;
    if(Number.isFinite(afterHp)){p.hp=Math.max(0,afterHp+Math.round(amt));}

  };
  seam.heal=function healEvent(v,amt,beforeHp){
    const p=S.players[v];if(!p)return;
    if(Number.isFinite(beforeHp))p.hp=Math.max(0,Math.min(p.max,beforeHp));
    heal(v,Math.round(amt));
  };
  seam.cast=function castEvent(pi,ai){
    cast(pi,ai,'production');
  };
  // Real ability cast telemetry (AIL 'Cast'): skill name + cooldown truth.
  // Visual cue ONLY: the production combatant owns cooldown/charges and
  // projects them every frame (applyState). A Cast event must never
  // become cooldown authority.
  seam.setSkill=function setSkill(pi,ai,patch){
    const a=S.players[pi]&&S.players[pi].abil[ai];if(!a||!patch)return;
    a.castUntil=patch.castUntil?performance.now()+380:0;
  };
  seam.ko=function koEvent(a,v){
    ko(a,v);
  };
  seam.status=function statusEvent(i,txt,ms){setStatus(i,txt,ms);};
  seam.pressSkill=function pressSkill(pi,ai){

  };
  seam.pressSwap=function pressSwap(pi){
    const bridge=window.APEX_GOLD;
    if(bridge&&bridge.pressSwap)bridge.pressSwap(pi);
  };

  // Canonical non-demo frame work only: skill cooldown rendering, ghost HP
  // decay (as authored in the donor update), thunder family animation.
  seam.tick=function tick(dt,now){
    for(let i=0;i<2;i++){
      const p=S.players[i];
      if(p.ghost>p.hp&&now>p.hold){p.ghost=Math.max(p.hp,p.ghost-dt*650);renderRail(i);}
      else if(p.ghost<p.hp){p.ghost=p.hp;renderRail(i);}
      // Production truth owns skill readiness: while a projection is
      // active the donor must not auto-restore charges between frames.
      for(let k=0;k<2;k++){
        const a=p.abil[k];if(!a||!a.__truth)continue;
        if(a.next&&now>=a.next){
          if(a.charges<a.max){a.charges++;a.next=a.charges<a.max?a.next+a.cd*1000:0;}
          else a.next=0;
        }
      }
    }
    renderSkills(now);
    drawThunder(now);
  };
})();
</script>

  if(S.ko||a.hp<=0||b.hp<=0){
    hudCriticalActive=false;
    return;
  }
  const bothLow=a.hp<=HUD_CRITICAL_HP&&b.hp<=HUD_CRITICAL_HP;
  const released=a.hp>HUD_CRITICAL_RELEASE_HP||b.hp>HUD_CRITICAL_RELEASE_HP;

  if(gap>=12)zone={x:root.x,y:upper.y+upper.h,w:Math.max(72,sr.x-root.x),h:gap};
 }
 if(!zone&&S.viewport.layout==='land')zone={x:ir.x,y:ir.y,w:ir.w,h:ir.h};
 if(!zone&&S.viewport.layout==='port'&&isLocalP2(v))zone={x:root.x,y:root.y+root.h*.44,w:Math.max(72,sr.x-root.x),h:root.h*.16};
 if(!zone)zone={x:root.x,y:root.y+root.h*.12,w:root.w,h:Math.max(24,root.h*.14)};
 const factor=kind==='stamp'?.34:.72;
 return {x:zone.x+zone.w/2,y:zone.y+zone.h*factor,w:zone.w,h:zone.h};
}
function popup(v,amt,kind){
 const f=G.f[v],now=performance.now(),last=S.fx.pop[v];
 if(kind==='n'&&last&&now-last.t<130&&last.el.isConnected){last.amt+=amt;last.el.textContent=last.amt;last.t=now;return;}
 while(R.afx.childElementCount>22)R.afx.firstElementChild.remove();
 const el=document.createElement('div');el.className='dmg '+kind;el.textContent=(kind==='heal'?'+':'')+amt;
 el.style.left=clamp((f.x+rnd(-26,26))/10,4,96)+'%';el.style.top=clamp((f.y-38)/10,4,96)+'%';R.afx.appendChild(el);
 const B='translate(-50%,-50%)'+(isLocalP2(v)?' rotate(180deg)':'');let kf,dur;
 if(kind==='n'){kf=[{transform:B+' translateY(4px) scale(1.3)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.12},{transform:B+' translateY(-14px)',opacity:1,offset:.6},{transform:B+' translateY(-26px)',opacity:0}];dur=620;}
 else if(kind==='heal'){kf=[{transform:B+' scale(.8)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.15},{transform:B+' translateY(-30px)',opacity:0}];dur=900;}
 else if(kind==='c'){kf=[{transform:B+' scale(1.9)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.12},{transform:B+' translateY(-10px)',opacity:1,offset:.65},{transform:B+' translateY(-34px)',opacity:0}];dur=900;}
 else{kf=[{transform:B+' scale(2.4)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.1},{transform:B+' translateX(-4px)',offset:.16},{transform:B+' translateX(3px)',offset:.22},{transform:B+' translateY(-8px)',opacity:1,offset:.7},{transform:B+' translateY(-36px)',opacity:0}];dur=1100;}
 if(RM.matches)kf=[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.7},{opacity:0}];
 el.animate(kf,{duration:dur,easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove();
 if(kind==='n')S.fx.pop[v]={el,t:now,amt};
}
function stamp(v,text,kind){
 const an=sideAnchor(v),fs=clamp(an.w*(kind==='heavy'?.13:.15),16,56);
 const el=document.createElement('div');el.className='stamp '+kind;el.textContent=text;el.style.fontSize=fs+'px';
 el.style.left=an.x+'px';el.style.top=(an.y-fs*.7)+'px';R.copy.appendChild(el);
 const B='translate(-50%,-50%)'+(isLocalP2(v)?' rotate(180deg)':'')+' skewX(-10deg)',[ox,oy]=outVec(v);
 const kf=RM.matches?[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.75},{opacity:0}]:
  [{transform:B+' scale(1.6)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.12},{transform:B+' scale(1)',opacity:1,offset:.72},{transform:`${B} translate(${ox*24}px,${oy*12}px) scale(1.03)`,opacity:0}];
 el.animate(kf,{duration:kind==='heavy'?900:780,easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove();
}
function bigNumber(v,amt,kind){
 const an=sideAnchor(v),fs=clamp(an.w*(kind==='h'?.2:.16),22,kind==='h'?84:64);
 const el=document.createElement('div');el.className='bignum '+kind;el.textContent=amt;el.style.fontSize=fs+'px';
 el.style.left=an.x+'px';el.style.top=(an.y+fs*.45)+'px';R.copy.appendChild(el);
 const B='translate(-50%,-50%)'+(isLocalP2(v)?' rotate(180deg)':'');
 const kf=RM.matches?[{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.75},{opacity:0}]:
  [{transform:B+' scale(2)',opacity:0},{transform:B+' scale(1)',opacity:1,offset:.12},{transform:B+' translateY(-6px)',opacity:1,offset:.7},{transform:B+' translateY(-22px)',opacity:0}];
 el.animate(kf,{duration:kind==='h'?1050:880,easing:'ease-out',fill:'forwards'}).onfinish=()=>el.remove();
}
function streakTo(pi,el){
 if(RM.matches)return;
 const r=relRect(el),a=relRect(R.arena),port=S.viewport.layout==='port';let x1,y1,x2,y2;
 if(port){x1=r.x+r.w/2;x2=clamp(x1,a.x+10,a.x+a.w-10);if(r.y>a.y){y1=r.y;y2=a.y+a.h;}else{y1=r.y+r.h;y2=a.y;}}
 else{y1=r.y+r.h/2;y2=clamp(y1,a.y+10,a.y+a.h-10);if(r.x<a.x){x1=r.x+r.w;x2=a.x;}else{x1=r.x;x2=a.x+a.w;}}
 const len=Math.hypot(x2-x1,y2-y1);if(len<3)return;
 const s=document.createElement('i');s.className='cstreak';s.style.width=len+'px';s.style.setProperty('--sc',ACC[pi]);
 const T=`translate(${x1}px,${y1}px) rotate(${Math.atan2(y2-y1,x2-x1)}rad)`;R.fx.appendChild(s);
 s.animate([{transform:T+' scaleX(0)',opacity:1},{transform:T+' scaleX(1)',opacity:1,offset:.45},{transform:T+' scaleX(1)',opacity:0}],{duration:360,easing:'ease-out',fill:'forwards'}).onfinish=()=>s.remove();
}
function ko(a,v,why){
 if(S.ko)return;S.ko=true;S.wins[a]++;renderTimer();
 const ar=relRect(R.arena),el=document.createElement('div');el.className='stamp ko';el.textContent=why==='TIME'?'TIME':'K.O.';
 el.style.fontSize=clamp(ar.w*.16,36,150)+'px';el.style.left=(ar.x+ar.w/2)+'px';el.style.top=(ar.y+ar.h/2)+'px';R.copy.appendChild(el);
 el.animate([{transform:'translate(-50%,-50%) skewX(-10deg) scale(2)',opacity:0},{transform:'translate(-50%,-50%) skewX(-10deg) scale(1)',opacity:1,offset:.1},{opacity:1,offset:.8},{opacity:0}],{duration:1700,fill:'forwards'}).onfinish=()=>el.remove();
 R.flash.style.background='rgba(255,255,255,.5)';R.flash.animate([{opacity:0},{opacity:1,offset:.1},{opacity:0}],{duration:400});
}

R.stage.addEventListener('pointerdown',e=>{
 const sk=e.target.closest('.skill');
 if(sk){e.preventDefault();const pi=+sk.dataset.p-1;if(S.mode==='1p'&&pi===1)return;APEX_GOLD_HUD.pressSkill(pi,+sk.dataset.i);return;}
 const sw=e.target.closest('.wp-swap');if(sw){e.preventDefault();const pi=+sw.dataset.p-1;if(S.mode==='1p'&&pi===1)return;APEX_GOLD_HUD.pressSwap(pi);return;}

let __apexLast=performance.now();
function frame(now){
 const dt=Math.min(.05,(now-__apexLast)/1000);__apexLast=now;
 try{APEX_GOLD_HUD.tick(dt,now);}catch(err){}
 requestAnimationFrame(frame);
}

<style id="apex-handoff-bridge-style">
.portrait>.apex-picked-portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;background:#0b0e10}
.portrait>.id-status{z-index:2}
</style>
<script id="apex-handoff-bridge-script">
(()=>{
  'use strict';
  const $=(s,r=document)=>r.querySelector(s);
  function setMode(mode){
    const hud=$('#hud');
    if(!hud) return;
    const desired=mode==='1p'?'1p':'2p';
    if(hud.dataset.mode!==desired){
      APEX_GOLD_HUD.setMode(desired);
    }
  }
  function applyIdentity(i,p){
    if(!p) return;
    const rail=$(i?'#p2Rail':'#p1Rail');
    const side=$(i?'#p2Side':'#p1Side');
    if(rail){
      const n=$('.vr-name',rail), sub=$('.vr-sub',rail);
      if(n)n.textContent=p.name||n.textContent;
      if(sub)sub.textContent=p.tag||sub.textContent;
    }
    if(side){
      const n=$('.id-name',side), sub=$('.id-sub',side);
      if(n)n.textContent=p.name||n.textContent;
      if(sub)sub.textContent=p.tag||sub.textContent;
      const portrait=$('.portrait',side);
      if(portrait && p.portrait){
        portrait.querySelectorAll(':scope > svg,:scope > .apex-picked-portrait').forEach(el=>el.remove());
        const img=document.createElement('img');
        img.className='apex-picked-portrait'; img.alt=''; img.draggable=false; img.src=p.portrait;
        portrait.insertBefore(img,portrait.firstChild);
      }
      const names=[...side.querySelectorAll('.sk-name')];
      if(p.skills){
        if(names[0]&&p.skills[1])names[0].textContent=p.skills[1];
        if(names[1]&&p.skills[2])names[1].textContent=p.skills[2];
      }
    }
  }
  window.addEventListener('message',e=>{
    const d=e.data;
    if(!d)return;
    if(d.type==='APEX_CHAOS_BATTLE_HANDOFF'){
      if(typeof S!=='undefined')S.paused=d.live===true?false:true;
      setMode(d.mode);
      requestAnimationFrame(()=>{
        applyIdentity(0,d.players&&d.players[0]);
        applyIdentity(1,d.players&&d.players[1]);
      });
      return;
    }
    if(d.type==='APEX_CHAOS_BATTLE_LIVE'){
      if(typeof S!=='undefined')S.paused=false;
      try{if(typeof last!=='undefined')last=performance.now();}catch(_){}
      return;
    }
    if(d.type==='APEX_CHAOS_BATTLE_PAUSE'){
      if(typeof S!=='undefined')S.paused=true;
    }
  });
  if(!document.__apexGoldHudExitKey){
    document.__apexGoldHudExitKey=true;
    const exitRoot=document.currentScript||null;
    document.addEventListener('keydown',e=>{
      if(e.key!=='Escape')return;
      if(exitRoot&&!exitRoot.isConnected)return;
      if(!exitRoot&&!document.body.classList.contains('battle-hud-open'))return;
      e.preventDefault();e.stopImmediatePropagation();
      parent.postMessage({type:'APEX_CHAOS_BATTLE_EXIT'},'*');
    },true);
  }

  try{if(typeof S!=='undefined')S.paused=true;}catch(_){}
  parent.postMessage({type:'APEX_CHAOS_HUD_READY'},'*');
})();
</script>
